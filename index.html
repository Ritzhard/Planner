/* ================= GLOSSARY =================
   GLOSSARY: [term, definition] — copied from the Skill Trees doc.
   GL_MATCH: which glossary terms get a hover tooltip in skill text, and how they're matched.
     [term, regex pattern for the word and its forms, case-sensitive?]
   Case-sensitive entries only match the capitalised mechanic ("Rot", not "rotation").
   Very common words (Attack, Hit, Strike, Weapon, Spell, Attack/Cast speed) are left out on purpose.
   Only the first occurrence of each term per skill is underlined. */
const GLOSSARY=[["Attack","Any offensive action, weapon or spell."],["Hit","An attack that lands on the target. Multi-hit attacks count each hit separately."],["Strike","Any attack."],["Kill","An enemy's death is credited to whoever applied the killing effect, including damage over time and delayed effects."],["Attack speed","How fast you attack with your weapon. Does not affect casting."],["Cast speed","How fast you cast spells. Separate stat from attack speed."],["Weapon","Any wielded weapon, including staffs and catalysts."],["Spell","A magic skill. Spells are not weapon-bound, so anyone who learns one can cast it."],["Damage over time","Burn, Bleed, Poison, Acid, Sear, Soulbleed, Blight, Infection, Rot, and similar. Ticks do NOT count as hits."],["Bleed","Hits and effects apply 1 Bleed (max 10). Bleed lasts 15 seconds, refreshed whenever a new stack is applied, ticking damage every 3 seconds. If the target moved in the last second (including displacement), ticks deal 50% bonus damage."],["Poison","Hits apply 1 Poison (max 10); poison skills apply 2 instead. Poison lasts 30 seconds, refreshed whenever a new stack is applied, ticking damage every 2 seconds. More stacks, heavier ticks."],["Acid","Hits apply 1 Acid (max 5). Acid lasts 12 seconds, refreshed on application, ticking damage every 3 seconds. Each Acid stack reduces the target's Defense by 3% while held."],["Sear","A burning brand (max 5 stacks, 10 seconds). Each time the target casts a spell, all Sear stacks deal damage at once and the duration is refreshed."],["Soulbleed","A shadow curse lasting 10 seconds, ticking every 2 seconds. Each tick heals the afflicter for 50% of the damage dealt."],["Blight","A creeping rot lasting 12 seconds, ticking every 3 seconds. If Blight is cleansed before it expires, it detonates for all its remaining tick damage plus 50%."],["Rot","Damage over time that pays out its stored damage over 5 seconds and ignores barriers."],["Slow","Reduces movement speed. Slows from different sources do not stack; the strongest applies."],["Snare","A stacking slow (max 5). Each Snare slows the target by 4%. At max Snare, the target is Rooted for 2 seconds and all Snare is removed. Snare is a debuff."],["Secondary hits","Count as hits, but can never trigger another secondary hit of the same kind."],["Debuff","Any negative status on a target: Burn, Chill, Static, Bleed, Poison, Acid, Sear, Soulbleed, Blight, Weight, Condemn, Infection, Snare, Wither, Weakened, Slow, curses, defense reductions. Crowd control effects are not debuffs. Stored damage is not a debuff."],["Stored damage","Damage banked on a target or object instead of being applied immediately, released later (often at a multiplier). Stored damage cannot be cleansed, transferred, or reduced."],["True damage","Damage that ignores barriers, Defense, and damage reduction."],["Mark","A status that identifies a target for the user and allies. Marks are not debuffs."],["Prey","A status that identifies a target as the user's quarry, for the user only. Prey is not a debuff and cannot be shared like a Mark."],["Crowd control","Effects that fully or partly remove control of a character: Stun, Silence, Freeze, Rooted, Grounded, Fear, Charm, Shackle, Blind, and Hysteria. Duration halved against stronger targets. After any crowd control ends, the target is immune to that same effect for 5 seconds."],["Rooted","The target cannot move from its position but can still attack, cast, and turn. Forced displacement (knockbacks, pulls, pushes, drags) still moves a Rooted target."],["Immobile","A target that is Rooted, Pinned, Frozen, Stunned, or Grappled. Any skill that references Immobile applies to a target in any of these states."],["Fear","The target flees from the user for the duration. Any damage taken ends Fear early."],["Charm","The target treats the user as an ally and the user's enemies as its own. Any damage taken ends Charm."],["Shackle","The target's weapons are bound: it cannot make weapon attacks, but can still move and cast."],["Blind","The target's attacks have a 50% chance to miss, and it cannot benefit from sight-based effects. Misses caused by Blind do not count as evasions."],["Position","The zone an attack comes from, relative to its target: Frontal (within its vision arc), Behind (outside it), or Above (airborne or elevated relative to it). A target without sight (Blind, or a sightless creature) has no vision arc: all attacks against it count as Behind. Only one positional bonus may apply per hit."],["Stagger","A brief interrupt that delays the target's next action by 1 second. Staggers are not crowd control: full duration applies to any target, and bosses are not immune between staggers."],["Displacement","Forced movement: knockbacks, pulls, pushes, and drags. Displacement always moves the target unless it is immune or anchored."],["Evasion","Avoiding an attack through evasion chance or an evasive skill (dodges, sidesteps, rolls, afterimages). Parries, deflects, and blocks are not evasions. Skills that \"count as an evasion\" trigger evasion effects (Drift, Riposte) even though no attack was avoided."],["Barrier","Any layer that absorbs damage before HP, including Blessing, Bulwark-based barriers, Lifeshield, and monster mana shells."],["Gadget","A mechanical device learned as a skill and carried ready. A deployed Gadget is an object: it can be targeted, destroyed, and affected by area effects."],["Healing reduction","Reduces all HP restored to a target, including healing, regeneration, and lifesteal."],["Weakened","The target deals reduced damage for the duration. Weakened is a debuff."],["Luck","A base stat that improves overall luck."],["Damage reduction","Max 60% combined from all sources."],["Evasion chance","Max 70%."],["Speed bonuses","Attack speed bonus max +200%. Cast speed bonus max +200%."],["Critical chance","Max 100%. Overcapped critical chance converts to critical damage at a 1:5 ratio."]];
const GL_MATCH=[
["Damage over time","damage over time",0],["Secondary hits","secondary hits?",0],["Stored damage","stored damage",0],
["True damage","true damage",0],["Crowd control","crowd control",0],["Healing reduction","healing reduction",0],
["Damage reduction","damage reduction",0],["Evasion chance","evasion chance",0],["Critical chance","critical chance",0],
["Evasion","evasions?",0],["Debuff","debuff(?:s|ed)?",0],["Slow","slow(?:s|ed|ing)?",0],["Stagger","stagger(?:s|ed|ing)?",0],
["Displacement","displacements?",0],["Barrier","barriers?",0],["Kill","kill(?:s|ed)?",0],
["Bleed","Bleed(?:s|ing)?",1],["Poison","Poison(?:s|ed)?",1],["Acid","Acid",1],["Sear","Sear",1],["Soulbleed","Soulbleed",1],
["Blight","Blight",1],["Rot","Rot",1],["Snare","Snare(?:s|d)?",1],["Mark","(?<!Scent )Mark(?:s|ed)?(?! a spot)(?![^.]*\\bas Prey)",1],["Prey","Prey",1],
["Rooted","Root(?:ed|s)?",1],["Immobile","Immobile",1],["Fear","Fear",1],["Charm","Charm(?:s|ed)?",1],
["Shackle","Shackle(?:s|d)?",1],["Blind","Blind(?:ed)?",1],["Position","Position(?:s|al)?",1],["Gadget","Gadgets?",1],
["Weakened","Weakened",1],["Luck","Luck",1]
];
const GL_DEF=Object.fromEntries(GLOSSARY);
const GL_RE=new RegExp("\\b(?:"+GL_MATCH.map(m=>"("+m[1]+")").join("|")+")\\b","gi");   /* one group per term */
let GL_SEEN=new Set();   /* reset per skill / curse box so each term is underlined once */
function gl(text){
  return String(text).replace(GL_RE,(w,...g)=>{
    const i=g.slice(0,GL_MATCH.length).findIndex(x=>x!==undefined);
    if(i<0)return w;
    const [k,,cs]=GL_MATCH[i];
    if(cs&&w[0]!==w[0].toUpperCase())return w;   /* capitalised mechanic only */
    if(!GL_DEF[k]||GL_SEEN.has(k))return w;
    GL_SEEN.add(k);
    return '<span class="gl" tabindex="0" data-g="'+esc(k)+'">'+w+'</span>';
  });
}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATN={melee:"Melee",ranged:"Ranged",magic:"Magic",support:"Support",auxiliary:"Auxiliary",cursed:"Cursed"};

function blank(){return{name:"",epithet:"",flavor:"",rank:"D",level:1,image:null,trees:[null,null,null],spent:{},path:[],pathAuto:false}}

const tree=id=>TREES.find(t=>t.id===id);
const tiersOf=t=>[...new Set(t.sk.map(s=>s.t))].sort((a,b)=>a-b);
const sumSpent=st=>Object.values(st.spent).reduce((a,b)=>a+b,0);
const totalSpent=()=>sumSpent(S);
const equipped=()=>S.trees.filter(Boolean);
const isUnranked=st=>st.rank==="U";
const skText=s=>(s.n+" "+s.x+" "+(s.s||[]).map(x=>x.join(" ")).join(" ")+" "+(s.f||[]).map(x=>x.join(" ")).join(" ")+" "+(s.h||[]).map(x=>x[1]+" "+x[3]).join(" ")).toLowerCase();

function ph(letter,color){return "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" rx="10" fill="'+color+'"/><text x="32" y="44" font-size="32" font-family="sans-serif" fill="#0f1115" text-anchor="middle" font-weight="bold">'+letter+'</text></svg>');}
/* ---- icons ----
   Files live next to index.html:  icons/<tree id>/01.webp  = tree icon,
                                   icons/<tree id>/02.webp … 09.webp = skills in tier order (09 = capstone).
   A skill's own img:"…" field overrides its file. If a file is missing, the letter tile / category glyph shows instead. */
const ICON_DIR="icons/";
const iconSrc=(t,n)=>ICON_DIR+t.id+"/"+String(n).padStart(2,"0")+".webp";
const IMG_FAIL='onerror="this.remove()" loading="lazy" decoding="async" alt=""';
function skImg(sk,t){
  const src=sk.img||iconSrc(t,t.sk.indexOf(sk)+2);
  return '<span class="skimg" style="background-image:url(\''+ph(sk.n[0],RARC[t.r])+'\')"><img src="'+src+'" '+IMG_FAIL+'></span>';
}
function treeIco(t){
  return '<span class="tico" title="'+t.n+'"><span class="tglyph">'+CATI[t.c]+'</span><img src="'+iconSrc(t,1)+'" '+IMG_FAIL+'></span>';
}
function badge(t){return '<span class="badge" style="background:'+RARC[t.r]+'">'+t.r+'</span>';}
function rankBadge(st){
  return '<span class="badge" style="background:'+(RANKC[st.rank]||RANKC.D)+'">'+(isUnranked(st)?"Unranked":"Rank "+st.rank)+'</span>';
}

function toast(m){const el=$("#toast");el.textContent=m;el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,1800);}

/* ---- leveling path: a list of tree ids, each entry = "next tier of that tree" ---- */
function pathSteps(path){
  const cur={},steps=[];let total=0;
  for(const id of path){
    const t=tree(id);if(!t)return null;
    const c=cur[id]||0,nx=tiersOf(t).find(T=>T>c);
    if(nx===undefined)return null;
    total+=nx-c;cur[id]=nx;
    steps.push({id,tier:nx,lv:total,skills:t.sk.filter(s=>s.t===nx)});
  }
  return {steps,cur};
}
function pathValid(st){
  const r=pathSteps(st.path||[]);if(!r)return false;
  const ids=new Set([...Object.keys(r.cur),...Object.keys(st.spent)]);
  for(const id of ids){
    if(!st.trees.includes(id))return false;
    if((r.cur[id]||0)!==(st.spent[id]||0))return false;
  }
  return true;
}
/* estimated order: birth tree first up to tier 9, then always the cheapest next tier (birth tree wins ties) */
function autoPath(st){
  const eq=st.trees.filter(Boolean),cur={},path=[],birth=st.trees[0];
  const nextOf=id=>{const T=tiersOf(tree(id)).find(T=>T>(cur[id]||0));return T!==undefined&&T<=(st.spent[id]||0)?T:null;};
  if(birth)for(;;){const T=nextOf(birth);if(T===null||T>9)break;path.push(birth);cur[birth]=T;}
  for(;;){
    let best=null,bc=1e9;
    for(const id of eq){const T=nextOf(id);if(T===null)continue;const c=T-(cur[id]||0);if(c<bc){bc=c;best=id;}}
    if(!best)break;
    const T=nextOf(best);path.push(best);cur[best]=T;
  }
  return path;
}

/* ---- slots ---- */
/* move mode: MOVE holds the slot being moved (null = off). Points are stored per tree,
   so moving a tree between slots keeps its investment. */
let MOVE=null;
function canMove(src,dst){
  if(src===dst)return false;
  const birth=dst===0?S.trees[src]:src===0?S.trees[dst]:S.trees[0];   /* what would sit in the birth slot */
  return !birth||tree(birth).ty===MAIN;
}
function slotAttrs(idx){
  let cls="",dnd=' ondragover="slotDragOver(event,'+idx+')" ondrop="slotDrop(event,'+idx+')"';
  if(MOVE!==null)cls=MOVE===idx?" moving":canMove(MOVE,idx)?" target":" nodrop";
  return {cls,dnd,click:' onclick="slotClick('+idx+')"'};
}
function slotHint(idx){
  if(MOVE===null||MOVE===idx)return MOVE===idx?'<div class="mvhint">Moving · tap a slot, or here to cancel</div>':'';
  return canMove(MOVE,idx)?'<div class="mvhint ok">'+(S.trees[idx]?'Swap here':'Move here')+'</div>'
    :'<div class="mvhint">Birth tree must be a Main Class tree</div>';
}
function slotClick(idx){
  if(MOVE===null){openPicker(idx);return;}
  if(MOVE===idx){MOVE=null;renderSlots();return;}
  if(canMove(MOVE,idx))doMove(MOVE,idx);
}
function startMove(idx,ev){ev.stopPropagation();MOVE=MOVE===idx?null:idx;renderSlots();}
function slotDragStart(ev,idx){MOVE=idx;try{ev.dataTransfer.setData("text/plain",String(idx));ev.dataTransfer.effectAllowed="move";}catch(e){}requestAnimationFrame(renderSlots);}
function slotDragOver(ev,idx){if(MOVE!==null&&canMove(MOVE,idx)){ev.preventDefault();try{ev.dataTransfer.dropEffect="move";}catch(e){}}}
function slotDrop(ev,idx){ev.preventDefault();if(MOVE!==null&&canMove(MOVE,idx))doMove(MOVE,idx);}
function slotDragEnd(){if(MOVE!==null){MOVE=null;renderSlots();}}
const SLOTN=["Birth tree","Sub tree 1","Sub tree 2"];
function doMove(src,dst){
  const a=S.trees[src],b=S.trees[dst];
  S.trees[src]=b;S.trees[dst]=a;
  [LOCK[src],LOCK[dst]]=[LOCK[dst],LOCK[src]];
  if((src===0||dst===0)&&S.trees[0])applyBirthRank(S.trees[0]);
  MOVE=null;renderAll();
  toast(b?"Swapped "+tree(a).n+" and "+tree(b).n:"Moved "+tree(a).n+" to "+SLOTN[dst]);
}
/* support birth tree = Unranked; leaving support moves rank off Unranked */
function applyBirthRank(id){const sup=tree(id).c==="support";if(sup&&S.rank!=="U")S.rank="U";else if(!sup&&S.rank==="U")S.rank="E";}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&MOVE!==null){MOVE=null;renderSlots();}});

function slotCard(t,idx,label){
  const A=slotAttrs(idx);
  if(!t)return '<div class="slot'+A.cls+'"'+A.click+A.dnd+'><div class="slotlab">'+label+'</div><div class="plus">+ choose a tree</div>'+slotHint(idx)+'</div>';
  const inv=S.spent[t.id]||0,pct=Math.min(100,inv/33*100);
  const lock='<button class="lock'+(LOCK[idx]?' on':'')+'" onclick="toggleLock('+idx+',event)" title="'+(LOCK[idx]?'Locked: kept when randomizing':'Lock this tree for the randomizer')+'" aria-label="Lock slot">'+(LOCK[idx]?'🔒':'🔓')+'</button>';
  const mv='<button class="lock mv'+(MOVE===idx?' on':'')+'" onclick="startMove('+idx+',event)" title="Move or swap this tree (points are kept)" aria-label="Move tree">⇄</button>';
  return '<div class="slot filled'+A.cls+'" style="border-color:'+RARC[t.r]+'"'+A.click+A.dnd+' draggable="true" ondragstart="slotDragStart(event,'+idx+')" ondragend="slotDragEnd()">'+lock+mv+'<div class="slotlab">'+label+' ♛</div><div class="tname">'+treeIco(t)+t.n+'</div>'+badge(t)+' <span style="font-size:12px;color:#8b94ab">'+inv+'/33 pts</span><div class="pbar"><i style="width:'+pct+'%;background:'+RARC[t.r]+'"></i></div>'+slotHint(idx)+'</div>';
}
function toggleLock(i,ev){ev.stopPropagation();LOCK[i]=!LOCK[i];renderSlots();}
function renderSlots(){
  $("#slots").innerHTML=
    slotCard(S.trees[0]?tree(S.trees[0]):null,0,"Birth tree")+
    slotCard(S.trees[1]?tree(S.trees[1]):null,1,"Sub tree 1")+
    slotCard(S.trees[2]?tree(S.trees[2]):null,2,"Sub tree 2");
}

/* ---- points + tree panels ---- */
function setSpent(id,T){
  const cur=S.spent[id]||0;if(T===cur)return;
  if(T>cur&&(totalSpent()-cur+T)>S.level){toast("Not enough points: level "+S.level+" = "+S.level+" pts");return;}
  const tiers=tiersOf(tree(id));
  if(T>cur){tiers.filter(x=>x>cur&&x<=T).forEach(()=>S.path.push(id));S.pathAuto=false;}
  else{let c=0;S.path=S.path.filter(p=>{if(p!==id)return true;const nx=tiers.find(x=>x>c);if(nx<=T){c=nx;return true;}return false;});}
  if(T<=0)delete S.spent[id];else S.spent[id]=T;
  renderAll();
}
function formTable(f){
  let h='<table class="ftab"><tr><th>Circle</th><th>Form</th><th>Effect</th></tr>';
  f.forEach(r=>{h+='<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td><td>'+gl(r[2])+(r[3]?'<br><i style="color:#8b94ab">Passive: '+gl(r[3])+'</i>':'')+'</td></tr>';});
  return h+'</table>';
}
function halves(h){
  return '<div class="halves">'+h.map(x=>'<div class="half"><div class="hside">'+x[0]+'</div><b>'+x[1]+'</b> <span class="tags">'+x[2].join(" · ")+'</span><div>'+gl(x[3])+'</div></div>').join("")+'</div>';
}
function curseText(t){return [t.cu[0],t.cu[1],...(t.cu[2]||[]).flat(),...(t.no||[]).flat()].join(" ").toLowerCase();}
function curseBox(t){
  if(!t.cu)return "";
  GL_SEEN=new Set();
  return '<div class="curse"><b>Curse · '+t.cu[0]+':</b> '+gl(t.cu[1])
    +((t.cu[2]||[]).length?'<ul>'+t.cu[2].map(x=>'<li><i>'+x[0]+':</i> '+gl(x[1])+'</li>').join("")+'</ul>':'')
    +(t.no||[]).map(x=>'<div style="margin-top:6px"><b>'+x[0]+':</b> '+gl(x[1])+'</div>').join("")+'</div>';
}
function skillRow(sk,t,unlocked,key){
  GL_SEEN=new Set();
  return '<details'+(key?' data-k="'+key+'"':'')+(key&&OPEN.has(key)?' open':'')+' class="sk '+(unlocked?"on":"off")+'"><summary><span class="chip">'+sk.t+'</span>'+skImg(sk,t)+'<b>'+sk.n+'</b>'+(sk.c?' <span class="star">★</span>':'')+' <span class="tags">'+sk.g.join(" · ")+'</span></summary><div class="body"><div>'+gl(sk.x)+(sk.s?'<ul>'+sk.s.map(x=>'<li>'+(x[0]?'<i>'+x[0]+':</i> ':'')+gl(x[1])+'</li>').join("")+'</ul>':'')+(sk.f?formTable(sk.f):'')+(sk.h?halves(sk.h):'')+'</div></div></details>';
}
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;e.target.open?OPEN.add(k):OPEN.delete(k);},true);

function renderTrees(){
  const eq=equipped().map(tree);
  $("#trees").innerHTML=eq.length?eq.map(t=>{
    const cur=S.spent[t.id]||0;
    const tiers=tiersOf(t);
    const chips='<button class="notch'+(cur===0?" act":"")+'" onclick="setSpent(\''+t.id+'\',0)">0</button>'+tiers.map(T=>{
      const afford=T<=cur||(totalSpent()-cur+T)<=S.level;
      const act=cur>=T;
      return '<button class="notch'+(act?" act":"")+(afford?"":" no")+'"'+(act?' style="background:'+RARC[t.r]+';color:#0f1115;border-color:'+RARC[t.r]+'"':'')+' onclick="setSpent(\''+t.id+'\','+T+')">'+T+'</button>';
    }).join("");
    const next=tiers.find(T=>T>cur);
    const nx=next?('Next at '+next+' pts: '+t.sk.filter(s=>s.t===next).map(s=>s.n).join(", ")):"Tree fully unlocked";
    const all=t.sk.map((sk,i)=>[sk,i]).sort((a,b)=>a[0].t-b[0].t);
    const shown=ONLY_UNLOCKED?all.filter(([sk])=>cur>=sk.t):all;
    const hidden=all.length-shown.length;
    const keys=shown.map(([,i])=>t.id+":"+i),allOpen=keys.length&&keys.every(k=>OPEN.has(k));
    const bar='<div class="sktools">'
      +(keys.length?'<button class="lnk" onclick="setTreeSkills(\''+t.id+'\','+!allOpen+')">'+(allOpen?'Collapse skills':'Expand skills')+'</button>':'')
      +(hidden?'<span>'+hidden+' locked skill'+(hidden>1?'s':'')+' hidden</span>':'')+'</div>';
    const rows=bar+(shown.length?shown.map(([sk,i])=>skillRow(sk,t,cur>=sk.t,t.id+":"+i)).join(""):'<div class="skempty">No skills unlocked yet. Click a tier above to invest.</div>');
    const open=TREE_OPEN.has(t.id),got=t.sk.filter(s=>cur>=s.t).length;
    return '<div class="treebox"><div class="treehead tgl" role="button" tabindex="0" aria-expanded="'+open+'" onclick="toggleTree(\''+t.id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleTree(\''+t.id+'\')}">'
      +treeIco(t)+'<span class="tname">'+t.n+'</span>'+badge(t)+' <span style="font-size:12px;color:#8b94ab">'+cur+'/33 pts · '+got+'/'+t.sk.length+' skills</span><span class="chev'+(open?' up':'')+'" title="'+(open?'Hide skills':'Show skills')+'">▾</span></div>'
      +'<div class="notches">'+chips+'</div><div class="nhint">'+nx+' · click a tier to invest up to it</div>'
      +(open?'<div class="sklist">'+curseBox(t)+rows+'</div>':'')+'</div>';
  }).join(""):'<div class="treebox" style="color:#5a627a;text-align:center">Pick your trees above to start spending points.</div>';
  $("#treeTools").innerHTML=eq.length?'<button class="lnk" onclick="setAllSkills(true)">Expand all</button><button class="lnk" onclick="setAllSkills(false)">Collapse all</button>'
    +'<label class="tgl-only"><input type="checkbox" '+(ONLY_UNLOCKED?'checked ':'')+'onchange="setOnlyUnlocked(this.checked)"> Unlocked skills only</label>':'';
  const sp=totalSpent(),left=S.level-sp;
  $("#pointsInfo").innerHTML='<span class="left'+(left<0?' over':'')+'">'+(left<0?(-left)+' over budget':left+' left')+'</span>'
    +'<span class="ptsdet">Level '+S.level+' · '+sp+'/'+S.level+' spent</span>'
    +'<span class="ptsseg">'+equipped().map(id=>{const t=tree(id),v=S.spent[id]||0;return '<i title="'+t.n+': '+v+' pts" style="flex:'+v+';background:'+RARC[t.r]+'"></i>';}).join("")+(left>0?'<i class="free" style="flex:'+left+'"></i>':'')+'</span>';
}

function toggleTree(id){TREE_OPEN.has(id)?TREE_OPEN.delete(id):TREE_OPEN.add(id);renderTrees();}
/* open or close every skill row in one tree */
function setTreeSkills(id,open){
  tree(id).sk.forEach((s,i)=>{const k=id+":"+i;open?OPEN.add(k):OPEN.delete(k);});
  renderTrees();
}
/* expand: open every equipped tree and all its skills · collapse: close skills and trees */
function setAllSkills(open){
  equipped().forEach(id=>{open?TREE_OPEN.add(id):TREE_OPEN.delete(id);tree(id).sk.forEach((s,i)=>{const k=id+":"+i;open?OPEN.add(k):OPEN.delete(k);});});
  renderTrees();
}
function setOnlyUnlocked(on){
  ONLY_UNLOCKED=on;try{localStorage.setItem("sk_onlyUnlocked",on?"1":"0");}catch(e){}
  renderTrees();
}

/* full skill card for the summary popup (no glossary underlines: the popup can't be hovered into) */
function skillTip(ref,lk){
  const [id,i]=ref.split(":"),t=tree(id),sk=t.sk[+i];
  let h='<div class="thead">'+skImg(sk,t)+'<div><b>'+sk.n+(sk.c?' ★':'')+'</b><div class="tmeta">'+t.n+' · tier '+sk.t+' · '+sk.g.join(" · ")+'</div>'+((lk!==undefined?lk==="1":(S.spent[t.id]||0)<sk.t)?'<div class="tlock">Locked · unlocks at '+sk.t+' pts</div>':'')+'</div></div>';
  if(sk.x)h+='<div>'+sk.x+'</div>';
  if(sk.s)h+='<ul>'+sk.s.map(x=>'<li>'+(x[0]?'<i>'+x[0]+':</i> ':'')+x[1]+'</li>').join("")+'</ul>';
  if(sk.f)h+='<ul>'+sk.f.map(r=>'<li><i>Circle '+r[0]+', '+r[1]+':</i> '+r[2]+(r[3]?' <span class="tmeta">Passive: '+r[3]+'</span>':'')+'</li>').join("")+'</ul>';
  if(sk.h)h+=sk.h.map(x=>'<div class="thalf"><i>'+x[0]+' · '+x[1]+'</i> <span class="tmeta">'+x[2].join(" · ")+'</span><div>'+x[3]+'</div></div>').join("");
  return h;
}
/* ---- character card: the build panel, and the same card enlarged in a pop-out ---- */
function charCard(big){
  const eq=equipped().map(tree);
  const nm=S.name||"Unnamed",ep=(S.epithet||"").trim();
  const showEp=ep&&ep.toLowerCase()!==(S.name||"").trim().toLowerCase();
  const port=S.image?'<div class="cport" style="background-image:url(\''+esc(S.image).replace(/'/g,"%27")+'\')"></div>'
    :'<div class="cport empty">'+esc((S.name||"?").trim()[0]||"?").toUpperCase()+'</div>';
  let h='<div class="chead">'+port+'<div class="cid"><h3>'+esc(nm)+'</h3>'+(showEp?'<div class="ep">'+esc(ep)+'</div>':'')
    +'<div class="row">'+rankBadge(S)+'<span class="chip">Lv '+S.level+'</span></div>'
    +((S.flavor||"").trim()?'<p class="cflav">'+esc(S.flavor.trim())+'</p>':'')+'</div></div>';
  if(!eq.length)return h+'<p class="cempty">No skill trees chosen yet.</p>';
  h+=eq.map((t,n)=>{
    const cur=S.spent[t.id]||0,got=t.sk.filter(s=>cur>=s.t).length;
    const lab=big?'<span class="clab">'+["Birth tree","Sub tree","Sub tree"][S.trees.indexOf(t.id)]+'</span>':'';
    return '<div class="ctree"><div class="cth">'+treeIco(t)+'<div class="ctn">'+lab+'<b>'+t.n+'</b></div><span class="ccount">'+got+'/'+t.sk.length+'</span></div>'
      +'<div class="cbar"><i style="width:'+(cur/33*100)+'%;background:'+RARC[t.r]+'"></i></div>'
      +'<div class="cicons">'+t.sk.map((s,i)=>'<span class="cskill'+(cur>=s.t?'':' locked')+(s.c?' cap':'')+'" tabindex="0" data-s="'+t.id+':'+i+'">'+skImg(s,t)
        +(big?'<span class="cname">'+s.n+'</span>':'')+'</span>').join("")+'</div></div>';
  }).join("");
  return h;
}
function renderSummary(){
  $("#summary").innerHTML='<button class="cpop" onclick="openCard()" title="Open as a character card" aria-label="Open as a character card">⤢</button>'+charCard(false);
  if(!$("#card").classList.contains("hidden"))$("#cardBody").innerHTML=charCard(true);
}
function openCard(){$("#cardBody").innerHTML=charCard(true);$("#card").classList.remove("hidden");}
function closeCard(){glHide();$("#card").classList.add("hidden");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#card").classList.contains("hidden"))closeCard();});

/* ---- picker ---- */
let pk={ctx:0,cat:"all",q:"",sel:null,page:0};
const PK_PER=15;   /* trees per picker page */
function openPicker(idx){MOVE=null;
  pk={ctx:idx,cat:"all",q:"",sel:S.trees[idx],page:0};
  if(pk.sel)pk.page=Math.floor(TREES.findIndex(t=>t.id===pk.sel)/PK_PER);   /* open on the page with the current tree */
  $("#pkTitle").textContent=idx===0?"Choose your birth tree (main class trees only)":"Choose a sub tree";
  $("#pkSearch").value="";
  renderPicker();$("#picker").classList.remove("hidden");
}
function closePicker(){$("#picker").classList.add("hidden");}
function renderPicker(){
  const cats=[["all","All"],...Object.keys(CATN).map(c=>[c,CATN[c]])];
  $("#pkTabs").innerHTML=cats.map(c=>'<button class="tab'+(pk.cat===c[0]?" on":"")+'" data-cat="'+c[0]+'" onclick="pk.cat=\''+c[0]+'\';pk.page=0;renderPicker()">'+(c[0]==="all"?"":'<span class="tglyph2">'+CATI[c[0]]+'</span>')+c[1]+'</button>').join("");
  renderCards();renderPrev();
}
function renderCards(){
  const q=pk.q.trim().toLowerCase();
  const others=S.trees.filter((id,i)=>id&&i!==pk.ctx);
  const cards=TREES.filter(t=>(pk.cat==="all"||t.c===pk.cat)).map(t=>{
    const dup=others.includes(t.id);
    const curseBlocked=t.c==="cursed"&&others.some(id=>tree(id).c==="cursed");
    const notMain=pk.ctx===0&&t.ty!==MAIN;
    const dis=dup||curseBlocked||notMain;
    const match=q&&(t.n.toLowerCase().includes(q)||(t.cu&&curseText(t).includes(q)));
    const hits=q?t.sk.filter(s=>skText(s).includes(q)).slice(0,3).map(s=>s.n):[];
    if(q&&!match&&!hits.length)return "";
    return '<div class="pcard'+(pk.sel===t.id?" sel":"")+(dis?" dis":"")+'" data-cat="'+t.c+'" onclick="'+(dis?"":"pickCard('"+t.id+"')")+'">'+treeIco(t)+'<b>'+t.n+'</b><br>'+badge(t)+'<span style="font-size:11px;color:#8b94ab"> '+t.ty+'</span>'+(hits.length?'<div class="hint">→ '+hits.join(", ")+'</div>':'')+(dup?'<div class="hint">already equipped</div>':'')+(curseBlocked?'<div class="hint">only one cursed tree</div>':'')+(notMain&&!dup?'<div class="hint">sub tree only</div>':'')+'</div>';
  }).filter(Boolean);
  const pages=Math.max(1,Math.ceil(cards.length/PK_PER));
  pk.page=Math.max(0,Math.min(pk.page,pages-1));
  $("#pkCards").innerHTML=cards.slice(pk.page*PK_PER,(pk.page+1)*PK_PER).join("")||'<div style="color:#5a627a">No matches.</div>';
  $("#pkPager").innerHTML=pages<2?"":
    '<button onclick="pkGo('+(pk.page-1)+')"'+(pk.page?'':' disabled')+'>‹ Back</button>'
    +'<span class="pnums">'+Array.from({length:pages},(_,i)=>'<button class="pnum'+(i===pk.page?' on':'')+'" onclick="pkGo('+i+')" aria-label="Page '+(i+1)+'">'+(i+1)+'</button>').join("")+'</span>'
    +'<button onclick="pkGo('+(pk.page+1)+')"'+(pk.page<pages-1?'':' disabled')+'>Next ›</button>';
}
function pkGo(p){pk.page=p;renderCards();}
function pickCard(id){pk.sel=id;renderCards();renderPrev();}
function renderPrev(){
  if(!pk.sel){$("#pkPrev").innerHTML='<span style="color:#5a627a">Click a tree to preview it.</span>';return;}   /* (an occupied slot always opens with its tree selected) */
  const t=tree(pk.sel);
  const same=pk.sel===S.trees[pk.ctx];
  $("#pkPrev").innerHTML='<b>'+treeIco(t)+t.n+'</b> '+badge(t)+'<div style="font-size:12px;color:#8b94ab">'+t.ty+'</div>'
    +curseBox(t)
    +t.sk.slice().sort((a,b)=>a.t-b.t).map(sk=>skillRow(sk,t,true)).join("")
    +'<div class="row pkact"><button class="btn-keep" onclick="commitPick()">'+(same?"Keep this tree":"Set as "+(pk.ctx===0?"birth tree":"sub tree"))+'</button>'
    +(S.trees[pk.ctx]?'<button class="btn-clear" onclick="clearSlot()" title="Remove '+tree(S.trees[pk.ctx]).n+' and its points from this slot">Clear this slot</button>':'')+'</div>';
}
function commitPick(){
  const id=pk.sel;if(!id)return;
  if(id===S.trees[pk.ctx]){closePicker();return;}   /* re-picking the same tree keeps its points */
  const old=S.trees[pk.ctx];
  if(old){delete S.spent[old];S.path=S.path.filter(p=>p!==old);}
  S.trees[pk.ctx]=id;LOCK[pk.ctx]=false;
  if(pk.ctx===0)applyBirthRank(id);
  closePicker();renderAll();
}
function clearSlot(){
  const old=S.trees[pk.ctx];
  if(old){delete S.spent[old];S.path=S.path.filter(p=>p!==old);S.trees[pk.ctx]=null;}
  LOCK[pk.ctx]=false;
  closePicker();renderAll();
}

/* ---- randomizer ----
   rules: birth tree is always a main class tree; Legendary trees only appear in the birth slot;
   at most one cursed tree (~30% chance, sub slots only); locked slots keep their tree and points */
/* true once the user picks a rank by hand: Random then keeps it and rolls a matching birth tree
   (Unranked → Support birth tree, any rank → non-Support). Reset clears it. */
let RANK_PINNED=false;
function randomBuild(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const trees=[null,null,null],spent={},path=[];
  LOCK.forEach((l,i)=>{if(l&&S.trees[i])trees[i]=S.trees[i];else LOCK[i]=false;});
  trees.forEach(id=>{if(id&&S.spent[id])spent[id]=S.spent[id];});
  S.path.forEach(id=>{if(trees.includes(id))path.push(id);});
  const used=()=>trees.filter(Boolean);
  if(!trees[0]){
    let pool=TREES.filter(t=>t.ty===MAIN&&!used().includes(t.id));
    if(RANK_PINNED){const want=S.rank==="U",m=pool.filter(t=>(t.c==="support")===want);if(m.length)pool=m;}
    trees[0]=pick(pool).id;
  }
  const free=[1,2].filter(i=>!trees[i]);
  if(free.length&&!used().some(id=>tree(id).c==="cursed")&&Math.random()<0.3)
    trees[pick(free)]=pick(TREES.filter(t=>t.c==="cursed")).id;
  [1,2].forEach(i=>{if(!trees[i])trees[i]=pick(TREES.filter(t=>t.c!=="cursed"&&t.r!=="Legendary"&&!used().includes(t.id))).id;});
  const locked=Object.values(spent).reduce((a,b)=>a+b,0),floor=Math.max(1,locked);
  const level=floor+Math.floor(Math.random()*(101-floor));
  let rem=level-locked,guard=0;
  while(guard++<400){
    const cands=trees.filter(id=>{const cur=spent[id]||0;return tiersOf(tree(id)).some(T=>T>cur&&T-cur<=rem);});
    if(!cands.length)break;
    const id=pick(cands),cur=spent[id]||0,tiers=tiersOf(tree(id));
    const T=pick(tiers.filter(T=>T>cur&&T-cur<=rem));
    tiers.filter(x=>x>cur&&x<=T).forEach(()=>path.push(id));
    rem-=T-cur;spent[id]=T;
  }
  /* a locked birth tree still decides Unranked vs ranked; otherwise a hand-picked rank is kept */
  const sup=tree(trees[0]).c==="support";
  const rank=sup?"U":(RANK_PINNED&&S.rank!=="U"?S.rank:pick(RANKS.slice(1)));
  /* name, title and portrait are the character, not the build: Random never touches them */
  S={...blank(),name:S.name,epithet:S.epithet,flavor:S.flavor,image:S.image,rank,level,trees,spent,path};
  renderAll();toast("Random build: Lv "+level+" · "+tree(trees[0]).n);
}

/* ---- identity ---- */
function setLevel(v){S.level=Math.max(1,Math.min(100,parseInt(v)||1));renderAll();}
/* Square-crop (cover) and resize an image with good quality.
   Big reductions are done in halving steps: a single big canvas downscale skips pixels and looks jagged. */
function squareImg(img,size,q){
  const sw=img.naturalWidth||img.width,sh=img.naturalHeight||img.height,side=Math.min(sw,sh);
  let src=document.createElement("canvas");src.width=src.height=side;
  let ctx=src.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(img,(sw-side)/2,(sh-side)/2,side,side,0,0,side,side);
  let cur=side;
  while(cur/2>=size){
    const n=document.createElement("canvas");n.width=n.height=Math.round(cur/2);
    const x=n.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
    x.drawImage(src,0,0,n.width,n.height);src=n;cur=n.width;
  }
  const out=document.createElement("canvas"),o=Math.min(size,cur);out.width=out.height=o;
  const c=out.getContext("2d");c.imageSmoothingEnabled=true;c.imageSmoothingQuality="high";
  c.drawImage(src,0,0,o,o);
  for(let qq=q;qq>=0.5;qq-=0.1){   /* stay under the size the app accepts for stored portraits */
    let d=out.toDataURL("image/webp",qq);if(!d.startsWith("data:image/webp"))d=out.toDataURL("image/jpeg",qq);
    if(d.length<580000)return d;
  }
  return out.toDataURL("image/jpeg",0.5);
}
function uploadImg(inp){
  const f=inp.files[0];inp.value="";if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{   /* 512px square: sharp on the big card, still small enough for saves in browser storage */
    S.image=squareImg(img,512,0.9);URL.revokeObjectURL(url);renderAll();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast("That file couldn't be read as an image");};
  img.src=url;
}

/* ---- share encoding: v3 = v2 + empty slots kept + leveling path; older codes still load ---- */
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}
function codeArr(st=S){
  const t=st.trees.map(id=>id?[id,st.spent[id]||0]:0);
  const p=(!st.pathAuto&&pathValid(st))?st.path.map(id=>st.trees.indexOf(id)).join(""):"";
  return [st.name,st.epithet,st.rank,st.level,t,p];
}
function packArr(st,img){
  const a=codeArr(st);a[6]=img||0;a[7]=(st.flavor||"").trim();
  while(a.length>5&&!a[a.length-1])a.pop();
  return a;
}
function code(st=S){return b64u(JSON.stringify(packArr(st)));}
function cleanCode(c){c=String(c||"").trim();if(c.includes("#"))c=c.split("#").pop();return c;}
/* portraits: an uploaded image (data URL) or a direct https link */
function safeImg(u){
  if(typeof u!=="string")return null;
  if(/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(u)&&u.length<600000)return u;
  if(/^https:\/\/[^\s"'()\\<>]+$/.test(u)&&u.length<2000)return u;
  return null;
}
function parseRaw(raw){
  let o;
  if(Array.isArray(raw)){
    const tl=Array.isArray(raw[4])?raw[4]:[];
    o={name:raw[0],epithet:raw[1],rank:raw[2],level:raw[3],
       trees:tl.map(x=>Array.isArray(x)?x[0]:null),
       spent:Object.fromEntries(tl.filter(x=>Array.isArray(x)&&x[1]>0).map(x=>[x[0],x[1]])),
       pathStr:typeof raw[5]==="string"?raw[5]:"",image:raw[6],flavor:raw[7]};
  }else{
    o=raw&&typeof raw==="object"?raw:{};
    if(o.birth!==undefined||o.subs!==undefined)o.trees=[o.birth||null,(o.subs&&o.subs[0])||null,(o.subs&&o.subs[1])||null];
    o.image=null;
  }
  let trees=(Array.isArray(o.trees)?o.trees:[]).slice(0,3).map(id=>typeof id==="string"&&tree(id)?id:null);
  while(trees.length<3)trees.push(null);
  trees=trees.map((id,i)=>id&&trees.indexOf(id)===i?id:null);              /* no duplicates */
  let cursed=false;
  trees=trees.map(id=>{if(id&&tree(id).c==="cursed"){if(cursed)return null;cursed=true;}return id;});  /* max one cursed */
  if(trees[0]&&tree(trees[0]).ty!==MAIN){                                    /* birth must be a main class tree */
    const id=trees[0];trees[0]=null;const f=trees.indexOf(null,1);if(f>0)trees[f]=id;
  }
  const spent={};
  trees.forEach(id=>{if(!id)return;const v=parseInt((o.spent||{})[id])||0;const T=tiersOf(tree(id)).filter(T=>T<=v).pop()||0;if(T)spent[id]=T;});
  const st={...blank(),name:String(o.name??"").slice(0,60),epithet:String(o.epithet??"").slice(0,80),flavor:String(o.flavor||"").slice(0,300),
    rank:RANKS.includes(o.rank)?o.rank:"D",level:Math.max(1,Math.min(100,parseInt(o.level)||1)),trees,spent,image:safeImg(o.image)};
  if(o.pathStr)st.path=[...o.pathStr].map(d=>trees[+d]||"?");
  if(!pathValid(st)){st.path=autoPath(st);st.pathAuto=true;}
  return st;
}
/* plain codes (saves, compare, short codes) */
function parseCode(c){try{c=cleanCode(c);if(!c||c.startsWith("z."))return null;return parseRaw(JSON.parse(unb64u(c)));}catch(e){return null;}}
/* links: "z." + deflate-compressed JSON (shorter, can hold a portrait); plain codes also accepted */
const CAN_ZIP=typeof CompressionStream==="function"&&typeof DecompressionStream==="function";
function bytesToB64u(buf){let bin="";for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function zip(str){const st=new Blob([str]).stream().pipeThrough(new CompressionStream("deflate-raw"));return bytesToB64u(new Uint8Array(await new Response(st).arrayBuffer()));}
async function unzip(b){
  b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
  if(txt.length>2e6)throw new Error("too large");
  return txt;
}
async function parseAny(c){
  c=cleanCode(c);
  if(c.startsWith("z.")){
    if(!CAN_ZIP||c.length>3e6)return null;
    try{return parseRaw(JSON.parse(await unzip(c.slice(2))));}catch(e){return null;}
  }
  return parseCode(c);
}
function loadCode(c){const st=parseCode(c);if(!st)return false;S=st;renderAll();return true;}

/* shrink an uploaded portrait for links (URLs stay as-is) */
function thumb(src,size=128){
  return new Promise(res=>{
    if(!src||!src.startsWith("data:"))return res(src||null);
    const img=new Image();
    img.onload=()=>{
      res(squareImg(img,size,0.72));
    };
    img.onerror=()=>res(null);img.src=src;
  });
}
async function buildLink(withImg){
  const img=withImg&&S.image?await thumb(S.image):null;
  const a=packArr(S,img);
  const json=JSON.stringify(a);
  const c=CAN_ZIP?"z."+await zip(json):b64u(json);
  return location.href.split("#")[0]+"#"+c;
}
const inFrame=()=>{try{return window.top!==window.self;}catch(e){return true;}};
let LINK_N=0;
function openShare(){
  $("#shCode").value=code();$("#shIn").value="";
  $("#shImg").checked=!!S.image;$("#shImg").disabled=!S.image;
  $("#shImg").parentElement.title=S.image?"":"Add a portrait first";
  $("#shFrame").style.display=inFrame()?"":"none";
  $("#share").classList.remove("hidden");makeLink();
}
async function makeLink(){
  const n=++LINK_N;$("#shUrl").value="Making link…";
  const u=await buildLink($("#shImg").checked);if(n!==LINK_N)return;
  $("#shUrl").value=u;
}
function copyText(u,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast(msg)).catch(()=>oldCopy(u,msg));
  else oldCopy(u,msg);
}
function oldCopy(u,msg){const i=document.createElement("textarea");i.value=u;document.body.appendChild(i);i.select();try{document.execCommand("copy");toast(msg);}catch(e){toast("Copy failed: select the text and copy it manually");}i.remove();}
function copyLink(){const u=$("#shUrl").value;if(!u.includes("#"))return;copyText(u,"Link copied");}
function copyCode(){copyText($("#shCode").value,"Code copied");}
async function doImport(){
  const st=await parseAny($("#shIn").value);
  if(!st){toast("Invalid code or link");return;}
  S=st;renderAll();
  toast("Build loaded");$("#share").classList.add("hidden");
}
function setImgUrl(v){
  v=String(v||"").trim();
  if(!v){if(S.image&&!S.image.startsWith("data:"))S.image=null;renderAll();return;}
  const u=safeImg(v);
  if(!u||!u.startsWith("https://")){toast("Use a direct https:// link to an image");$("#inpImg").value="";return;}
  S.image=u;renderAll();
}

/* ---- save / load ---- */
function getSaves(){try{return JSON.parse(localStorage.getItem("stp_saves")||"[]");}catch(e){return[];}}
function putSaves(sv){try{localStorage.setItem("stp_saves",JSON.stringify(sv));return true;}catch(e){toast("Couldn't save: browser storage is full or blocked");return false;}}
function openSave(){$("#svTitle").textContent="Save build";$("#svRow").style.display="";renderSaves();$("#saves").classList.remove("hidden");}
function openLoad(){$("#svTitle").textContent="Load build";$("#svRow").style.display="none";renderSaves();$("#saves").classList.remove("hidden");}
function renderSaves(){
  $("#svList").innerHTML=getSaves().map((s,i)=>'<div class="sv"><b style="flex:1">'+esc(s.name)+'</b><button onclick="loadSave('+i+')">Load</button><button onclick="delSave('+i+')">Delete</button></div>').join("")||'<div style="color:#5a627a">No saved builds yet.</div>';
}
function doSave(){
  const name=$("#svName").value.trim()||(S.name||"Untitled")+" (Lv "+S.level+")";
  const sv=getSaves();sv.push({name:name,c:code(),img:S.image});
  if(!putSaves(sv))return;
  $("#svName").value="";toast("Saved");renderSaves();
}
function loadSave(i){
  const s=getSaves()[i];if(!s)return;
  if(loadCode(s.c)){if(s.img)S.image=s.img;renderAll();toast("Loaded: "+s.name);$("#saves").classList.add("hidden");}
  else toast("That save couldn't be read");
}
function delSave(i){const sv=getSaves();sv.splice(i,1);putSaves(sv);renderSaves();}

/* ---- compare ---- */
let CB=null;
function openCompare(){
  const sv=getSaves();
  $("#cmpSel").innerHTML='<option value="">Pick a saved build…</option>'+sv.map((s,i)=>'<option value="'+i+'">'+esc(s.name)+'</option>').join("");
  $("#cmpIn").value="";renderCompare();$("#cmp").classList.remove("hidden");
}
function cmpFromSave(i){if(i==="")return;const s=getSaves()[+i];CB=s?parseCode(s.c):null;if(CB&&s.img)CB.image=s.img;if(!CB)toast("That save couldn't be read");renderCompare();}
function cmpFromCode(){const b=parseCode($("#cmpIn").value);if(!b){toast("Invalid code");return;}CB=b;renderCompare();}
function unlockedSet(st){const s=new Set();st.trees.forEach(id=>{if(!id)return;const cur=st.spent[id]||0;tree(id).sk.forEach(k=>{if(cur>=k.t)s.add(id+"|"+k.n);});});return s;}
function cmpCol(st,other,label){
  const theirs=unlockedSet(other);
  const ep=(st.epithet||"").trim(),showEp=ep&&ep.toLowerCase()!==(st.name||"").trim().toLowerCase();
  const port=st.image?'<div class="cport" style="background-image:url(\''+esc(st.image).replace(/'/g,"%27")+'\')"></div>'
    :'<div class="cport empty">'+esc(((st.name||"?").trim()[0]||"?").toUpperCase())+'</div>';
  let h='<div class="ccol"><div class="chead">'+port+'<div class="cid"><div class="slotlab">'+label+'</div><h3>'+esc(st.name||"Unnamed")+'</h3>'
    +(showEp?'<div class="ep">'+esc(ep)+'</div>':'')
    +'<div class="row">'+rankBadge(st)+'<span class="chip">Lv '+st.level+'</span><span class="chip">'+sumSpent(st)+' pts</span></div></div></div>';
  st.trees.forEach((id,i)=>{
    const lab=i?"Sub tree "+i:"Birth tree";
    if(!id){h+='<div class="ctree"><div class="clab">'+lab+'</div><span class="cempty2">empty slot</span></div>';return;}
    const t=tree(id),cur=st.spent[id]||0,shared=other.trees.includes(id);
    const oc=shared?(other.spent[id]||0):null;
    const diff=shared&&oc!==cur?' ('+(cur>oc?'+':'')+(cur-oc)+')':'';
    h+='<div class="ctree"><div class="cth">'+treeIco(t)+'<div class="ctn"><span class="clab">'+lab+'</span><b>'+t.n+'</b></div>'
      +'<span class="ccount">'+cur+'/33'+(shared?' · <span class="cshared">shared'+diff+'</span>':'')+'</span></div>'
      +'<div class="cbar"><i style="width:'+(cur/33*100)+'%;background:'+RARC[t.r]+'"></i></div>'
      +'<div class="cicons">'+t.sk.map((k,j)=>{
        const on=cur>=k.t,uniq=on&&!theirs.has(id+"|"+k.n);
        return '<span class="cskill'+(on?'':' locked')+(k.c?' cap':'')+(uniq?' uniq':'')+'" tabindex="0" data-s="'+id+':'+j+'" data-l="'+(on?0:1)+'">'+skImg(k,t)+'<span class="cname">'+k.n+'</span></span>';
      }).join("")+'</div></div>';
  });
  return h+'</div>';
}
function renderCompare(){
  if(!CB){$("#cmpOut").innerHTML='<p class="nhint">Choose a saved build or paste a code to compare it with your current build.</p>';return;}
  const a=unlockedSet(S),b=unlockedSet(CB),both=[...a].filter(x=>b.has(x)).length;
  $("#cmpOut").innerHTML='<div class="cmpbar"><p class="nhint"><span class="ukey"></span> Outlined skills are unique to that build · '+both+' skill'+(both===1?'':'s')+' shared</p>'
    +'<button onclick="swapCompare()">Swap: edit the compared build</button></div>'
    +'<div class="cgrid ccard cmpcard">'+cmpCol(S,CB,"Current")+cmpCol(CB,S,"Compared")+'</div>';
}
function swapCompare(){if(!CB)return;const old=S;S=CB;CB=old;renderAll();renderCompare();toast("Swapped builds");}

function resetAll(){
  if(!confirm("Reset the whole character?"))return;
  S=blank();LOCK=[false,false,false];RANK_PINNED=false;OPEN.clear();TREE_OPEN.clear();
  try{history.replaceState(null,"",location.pathname);}catch(e){}
  renderAll();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")["#picker","#share","#saves","#cmp"].forEach(s=>$(s).classList.add("hidden"));});

/* ---- boot ---- */
let LAST_HASH="";
/* an untouched character keeps a clean URL; anything else is carried in the hash */
function isBlank(st){const b=blank();return !st.name&&!st.epithet&&!(st.flavor||"").trim()&&!st.image&&st.level===b.level&&!st.trees.some(Boolean);}
function syncHash(){
  LAST_HASH=isBlank(S)?"":code();
  try{history.replaceState(null,"",LAST_HASH?"#"+LAST_HASH:location.pathname+location.search);}catch(e){}
}
function softRender(){renderSummary();syncHash();}   /* typing a name doesn't rebuild the trees */
function renderAll(){
  if(!pathValid(S)){S.path=autoPath(S);S.pathAuto=true;}
  LOCK=LOCK.map((l,i)=>l&&!!S.trees[i]);
  $("#inpName").value=S.name;$("#inpEpithet").value=S.epithet;$("#inpFlavor").value=S.flavor||"";$("#inpLevel").value=S.level;
  $("#selRank").value=S.rank;
  $("#portrait").style.backgroundImage=S.image?'url("'+S.image+'")':"";
  $("#inpImg").value=S.image&&!S.image.startsWith("data:")?S.image:"";
  $("#portrait").innerHTML=S.image?"":"click to<br>upload";
  renderSlots();renderTrees();renderSummary();
  syncHash();
}



/* ---- glossary tooltip: hover on desktop, tap on touch, focus with keyboard ---- */
let GL_PIN=null;
const TIP_SEL=".gl,.skl[data-s],.cskill[data-s]";
function glShow(el){
  const tip=$("#gtip"),k=el.dataset.g;
  if(el.dataset.s){tip.innerHTML=skillTip(el.dataset.s,el.dataset.l);tip.classList.add("wide");}
  else{tip.innerHTML='<b>'+esc(k)+'</b>'+esc(GL_DEF[k]||"");tip.classList.remove("wide");}
  tip.scrollTop=0;tip.classList.add("show");tip.classList.toggle("pinned",!!GL_PIN);
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-tw/2),innerWidth-tw-8);
  let y=r.bottom+6;if(y+th>innerHeight-8)y=r.top-th-6;
  tip.style.left=x+"px";tip.style.top=Math.max(8,y)+"px";
}
function glHide(){$("#gtip").classList.remove("show","pinned");if(GL_PIN){GL_PIN.classList.remove("on");GL_PIN=null;}}
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(TIP_SEL);if(el&&!GL_PIN)glShow(el);});
document.addEventListener("mouseout",e=>{const el=e.target.closest&&e.target.closest(TIP_SEL);if(el&&!GL_PIN)glHide();});
document.addEventListener("click",e=>{
  if(e.target.closest&&e.target.closest("#gtip"))return;   /* clicks inside a pinned popup keep it open */
  const el=e.target.closest&&e.target.closest(TIP_SEL);
  if(!el){if(GL_PIN)glHide();return;}
  e.preventDefault();
  if(GL_PIN===el){glHide();return;}
  glHide();GL_PIN=el;el.classList.add("on");glShow(el);
});
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches(TIP_SEL))glShow(e.target);});
document.addEventListener("focusout",e=>{if(e.target.matches&&e.target.matches(TIP_SEL)&&!GL_PIN)glHide();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")glHide();});
addEventListener("scroll",e=>{if(e.target.id!=="gtip")glHide();},true);addEventListener("resize",glHide);


/* keep the sticky points bar just under the (sticky, wrapping) header */
(function(){const h=document.querySelector("header");const set=()=>document.documentElement.style.setProperty("--hh",h.offsetHeight+"px");set();
  if(window.ResizeObserver)new ResizeObserver(set).observe(h);else addEventListener("resize",set);})();
/* ---- boot: links carry the build in the URL hash ---- */
const BOOT_HASH=location.hash.slice(1);
renderAll();
if(BOOT_HASH.length>1)loadFromHash(BOOT_HASH);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==LAST_HASH)loadFromHash(h);});
async function loadFromHash(h){
  const st=await parseAny(decodeURIComponent(h));
  if(!st){toast("That link doesn't contain a valid build");return;}
  S=st;renderAll();if(!isBlank(st))toast(st.name?"Loaded build: "+st.name:"Loaded build from link");
}
</script>
