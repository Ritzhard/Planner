{t:1,n:"Steady Aim",g:["Passive","Utility"],x:"Rifles and longbows gain extended range."},
{t:3,n:"Aimed Shot",g:["Active","Damage"],x:"A precise rifle or longbow shot at a weak point. Guaranteed critical hit at 5+ Focus."},
{t:6,n:"Focus",g:["Passive","Offense"],x:"Gain 1 Focus per 3 seconds while not attacking and not taking damage (max 10). Aiming doubles the gain. Taking damage removes all Focus. The next attack consumes all Focus, gaining bonus critical damage per Focus consumed."},
{t:9,n:"Prediction",g:["Active","Utility"],x:"Anticipates the next incoming attack within 2 seconds. If that attack is avoided, gain 3 Focus and the attacker is Exposed for 3 seconds, taking increased critical damage from the user."},
{t:11,n:"Spotter",g:["Active","Utility"],x:"Marks a target, causing it to take bonus damage from allies."},
{t:14,n:"Calm Breath",g:["Passive","Defense"],x:"Taking damage removes only 50% of current Focus."},
{t:21,n:"Close Quarters Shot",g:["Passive","Offense"],x:"Attacks consuming 10 Focus against targets within 5 meters deal double critical damage."},
{t:33,n:"Kill Shot",g:["Active","Damage"],c:1,x:"A rifle or longbow shot that consumes all Focus. Guaranteed critical hit that ignores barriers and defense. Damage greatly increases the closer the target is. Passive: Focus builds twice as fast while aiming (stacks with Focus's own aiming bonus)."}]},
{id:"gunner",n:"Gunner",c:"ranged",r:"Common",ty:"Main Class Tree",sk:[
{t:1,n:"Firearm Handling",g:["Passive","Utility"],x:"Firearms have reduced recoil and faster reloads. Unlocks Rounds: special ammunition, each type learned as its own skill. Up to 2 round types can be held ready at once, and switching between them is instant."},
{t:3,n:"Incendiary Rounds",g:["Round","Damage"],x:"Firearm hits apply Burn."},
{t:6,n:"Frost Rounds",g:["Round","Control"],x:"Firearm hits apply Chill."},
{t:9,n:"Round Chain",g:["Passive","Offense"],x:"Hitting a target with a different round type than the previous hit deals bonus damage."},
{t:11,n:"Shock Rounds",g:["Round","Control"],x:"Firearm hits apply Static and briefly stagger the target."},
{t:14,n:"Extra Chamber",g:["Passive","Utility"],x:"Up to 3 round types can be held ready at once."},
{t:21,n:"Explosive Rounds",g:["Round","Damage"],x:"Firearm hits explode in a small area. Explosions on a target affected by Burn, Chill, or Static trigger a reaction."},
{t:33,n:"Mixed Shot",g:["Active","Damage"],c:1,x:"Loads a single round combining every round type held ready. The shot applies all of their effects at once and triggers every possible reaction. Passive: the Round Chain bonus doubles when cycling through 3 different round types in a row."}]},
{id:"huntsman",n:"Huntsman",c:"ranged",r:"Uncommon",ty:"Main Class Tree",sk:[
{t:1,n:"Snare Arrow",g:["Passive","Control"],x:"Bow and crossbow hits apply 1 Snare (max 5). Snare lasts 12 seconds, refreshed whenever a new stack is applied. At max Snare, the target is Rooted for 2 seconds and all Snare is removed."},
{t:3,n:"Called Shot",g:["Active","Damage"],x:"A carefully aimed bow or crossbow shot. Against an Immobile target, it deals greatly increased damage and counts as 3 hits. 10-second cooldown."},
{t:6,n:"No Escape",g:["Passive","Offense"],x:"Hits against Immobile targets deal +15% damage and cannot be evaded."},
{t:9,n:"Bear Trap",g:["Active","Control"],x:"Places a trap at a location (max 3 active). The first enemy to step on it is Rooted for 3 seconds and gains 2 Bleed. Traps are visible only to the user and their allies."},
{t:11,n:"Pursuit",g:["Passive","Offense"],x:"Each consecutive hit on the same Immobile target grants 1 Pursuit on it (max 5), increasing the user's damage against it by 5% per Pursuit. Called Shot consumes all Pursuit on its target, adding double the bonus to that shot."},
{t:14,n:"Bola",g:["Active","Control"],x:"Throws a weighted bola at a target within 15 meters, Rooting it for 2 seconds. Flying targets are knocked to the ground and Grounded instead. After throwing, the user gains a brief burst of movement speed."},
{t:21,n:"Kill Zone",g:["Active","Damage"],x:"Fires a fan of arrows into a cone, dealing full damage to Immobile targets and half damage to moving ones. Every enemy hit gains 2 Snare."},
{t:33,n:"The Grand Hunt",g:["Active","Damage"],c:1,x:"For 15 seconds, every enemy within 20 meters is treated as Immobile for the user's skills, and the user's hits against them deal bonus damage per Snare on them. Passive: Snare's Root lasts 3 seconds and no longer removes Snare, and Called Shot's cooldown is halved."}]},
{id:"gunslinger",n:"Gunslinger",c:"ranged",r:"Uncommon",ty:"Main Class Tree",sk:[
{t:1,n:"Handgun Handling",g:["Passive","Utility"],x:"Handguns are drawn instantly and fire accurately. Strikes made with a handgun count as melee attacks."},
{t:3,n:"Breakaway",g:["Active","Control"],x:"Drives a handgun into a target within arm's reach and fires point-blank, heavily staggering it and forcing space."},
{t:6,n:"Tempo",g:["Passive","Offense"],x:"Alternating between a melee attack and a handgun shot grants 1 Tempo (max 10). Each Tempo grants bonus damage and attack speed. Repeating the same type of attack grants no Tempo. Tempo resets after 3 seconds without an attack."},
{t:9,n:"Redirect",g:["Active","Defense"],x:"Deflects an incoming attack within melee range. The next handgun shot against the attacker is a guaranteed critical hit."},
{t:11,n:"Slide Reload",g:["Active","Mobility"],x:"A short slide in any direction that fully reloads every carried firearm."},
{t:14,n:"In Your Face",g:["Passive","Defense"],x:"Takes reduced damage from targets within 3 meters."},
{t:21,n:"Twin Draw",g:["Passive","Offense"],x:"While dual wielding handguns, every handgun shot fires both guns (2 hits). At 5+ Tempo, both shots are critical hits."},
{t:33,n:"Dead Man's Draw",g:["Active","Damage"],c:1,x:"Consumes all Tempo to unleash a rapid sequence of alternating strikes and shots, one per Tempo consumed, spread across targets within 5 meters. Passive: Tempo max increased to 20, and Tempo resets after 5 seconds instead of 3."}]},
{id:"heavy_gunner",n:"Heavy Gunner",c:"ranged",r:"Uncommon",ty:"Main Class Tree",sk:[
{t:1,n:"Heavy Firearm Handling",g:["Passive","Utility"],x:"Rifles and heavy firearms have reduced recoil and feel lighter to carry and aim."},
{t:3,n:"Point-Blank",g:["Passive","Offense"],x:"Greatly increases damage dealt to targets within 5 meters."},
{t:6,n:"Heat",g:["Passive","Offense"],x:"Each firearm shot adds Heat (max 100). At 100, the user Overheats and cannot fire for 5 seconds. Heat cools while not firing. Firearm attacks deal bonus damage scaling with Heat."},
{t:9,n:"Heat Plating",g:["Passive","Defense"],x:"Grants damage reduction scaling with Heat."},
{t:11,n:"Shoulder Bash",g:["Active","Control"],x:"Braces behind the weapon's weight and rams a short distance in any direction, becoming briefly unstoppable. The first enemy hit is knocked back and staggered."},
{t:14,n:"Vent",g:["Active","Damage"],x:"Instantly dumps all Heat in a scorching blast that damages and knocks back nearby enemies. Damage scales with Heat vented."},
{t:21,n:"Hold the Line",g:["Passive","Defense"],x:"While firing continuously, the user cannot be knocked back or staggered, and enemies hit are slowed."},
{t:33,n:"Overdrive",g:["Active","Offense"],c:1,x:"For 10 seconds, Heat locks at 100 without Overheating and attack speed is doubled. Afterwards, the user Overheats in a Meltdown that damages all nearby enemies. Passive: Overheat lasts 3 seconds."}]},
{id:"demolisher",n:"Demolisher",c:"ranged",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Heavy Machinery",g:["Passive","Utility"],x:"Greatly increases carrying strength. Unlocks Recoil: each heavy ranged weapon shot pushes the user a short distance in the opposite direction of the shot, and firing at the ground launches the user upward. The heavier the weapon, the stronger the Recoil."},
{t:3,n:"Blast Shell",g:["Active","Damage"],x:"Fires an explosive shell from a heavy ranged weapon that deals heavy damage to an area."},
{t:6,n:"Blast Shielding",g:["Passive","Defense"],x:"Immune to the user's own explosions. Reduced damage from all area attacks."},
{t:9,n:"Rocket Jump",g:["Active","Mobility"],x:"Fires a shell from a heavy ranged weapon at the ground, launching high into the air. The explosion damages enemies below."},
{t:11,n:"Air Superiority",g:["Passive","Offense"],x:"Attacks made while airborne deal bonus damage."},
{t:14,n:"Recoil Control",g:["Passive","Utility"],x:"Recoil distance can be extended or cancelled at will. Landing after Recoil or Rocket Jump releases a small shockwave."},
{t:21,n:"Cluster Shell",g:["Active","Damage"],x:"A heavy ranged weapon shell that splits into multiple explosions (each a separate hit)."},
{t:33,n:"Living Arsenal",g:["Active","Buff"],c:1,x:"For 15 seconds, greatly increases attack speed, damage, and movement speed, and grants full control of movement while airborne. Passive: Recoil pushes twice as far, and area attacks gain increased radius."}]},
{id:"thrower",n:"Thrower",c:"ranged",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Throwing Arm",g:["Passive","Utility"],x:"Thrown weapons fly farther and faster. Any weapon can be thrown. Unlocks Embed: thrown weapons that hit a target or surface stay embedded there until recalled (max 3 embedded at once)."},
{t:3,n:"Recall",g:["Active","Damage"],x:"Pulls all embedded weapons back to hand. Each weapon hits everything along its return path."},
{t:6,n:"Anchor Step",g:["Active","Mobility"],x:"Instantly teleports to an embedded weapon, returning it to hand."},
{t:9,n:"Impale",g:["Passive","Control"],x:"Targets with embedded weapons are slowed and take increased damage for each weapon embedded in them."},
{t:11,n:"Yank",g:["Active","Control"],x:"Pulls a target with an embedded weapon toward the user. If the target is too heavy or stronger than the user, the user is pulled to it instead."},
{t:14,n:"Conduit",g:["Passive","Utility"],x:"Spells and area skills can be cast from the position of any embedded weapon, as if the user were standing there."},
{t:21,n:"Ricochet Throw",g:["Active","Damage"],x:"A throw that bounces between up to 5 targets, hitting each one, and embeds in the last."},
{t:33,n:"Constellation",g:["Active","Buff"],c:1,x:"For 20 seconds, greatly increases throwing speed and damage, and Anchor Step and Recall have no cooldown. Passive: embed limit increased to 6, and Recall damage is doubled."}]},
{id:"sky_piercer",n:"Sky Piercer",c:"ranged",r:"Legendary",ty:"Main Class Tree",sk:[
{t:1,n:"Farsight",g:["Passive","Utility"],x:"Greatly enhances vision, granting night vision and greatly increased accuracy at long range."},
{t:3,n:"Mortal's Challenge",g:["Active","Buff"],x:"Declares a target stronger than the user as a Challenge for 30 seconds. Attacks against the Challenged target deal greatly increased damage."},
{t:6,n:"Defiance",g:["Passive","Offense"],x:"Attacks deal bonus damage scaling with how much stronger the target is than the user."},
{t:9,n:"Unwavering",g:["Passive","Utility"],x:"Attacks, draws, and casts cannot be interrupted, and accuracy is unaffected by wind, drop, glare, or fear."},
{t:11,n:"Sky Step",g:["Active","Mobility"],x:"Creates small steps of air, allowing travel through the air for 5 minutes."},
{t:14,n:"Indomitable",g:["Passive","Offense"],x:"Attacks against targets stronger than the user ignore barriers and damage-reducing effects."},
{t:21,n:"Nine Suns",g:["Passive","Offense"],x:"Every 9th hit on the same target deals massive bonus damage."},
{t:33,n:"Against the Heavens",g:["Active","Buff"],c:1,x:"For 20 seconds, every target counts as stronger than the user. Passive: Defiance bonus is doubled."}]},

/* ---- MAGIC ---- */
{id:"pyromancer",n:"Pyromancer",c:"magic",r:"Common",ty:"Main Class Tree",sk:[
{t:1,n:"Flame Affinity",g:["Passive","Utility"],x:"Fire spells deal increased damage. Grants heat resistance and immunity to the user's own fire. Learn Ember Bolt: a fast-moving fireball whose velocity scales with attack speed or cast speed, whichever is higher."},
{t:3,n:"Tinder",g:["Passive","Offense"],x:"Hits apply 1 Burn (max 10); fire spells apply 2 instead. Burn lasts 15 seconds, refreshed whenever a new stack is applied."},
{t:6,n:"Fervor",g:["Passive","Offense"],x:"Whenever an enemy gains Burn or a Burn ticks, the user gains 1 Fervor (max 25). Each Fervor grants +1% fire damage, and every 5 Fervor grants +5% attack speed and cast speed. Fervor decays by 2 every 3 seconds while no enemy is Burning."},
{t:9,n:"Flash Fire",g:["Active","Damage"],x:"Hurls a rolling wave of fire forward, striking every enemy it passes through (each a separate hit). Enemies already Burning take +50% damage from the wave, and their Burn cannot be removed for 10 seconds."},
{t:11,n:"Wildfire",g:["Active","Utility"],x:"Transfers all Burn on a target to the 2 nearest enemies within 8 meters (each gains the full amount), removing it from the original target. Every enemy that gains Burn this way takes immediate fire damage. If no enemies are in range, the cooldown is refunded."},
{t:14,n:"Immolate",g:["Active","Defense"],x:"Sheathes the user in flame for 15 seconds. Enemies that hit the user with a melee attack take fire damage and gain 2 Burn. While Immolate is active, the user gains +15% attack speed and cast speed."},
{t:21,n:"Flame Meteor",g:["Active","Damage"],x:"Calls a burning meteor onto a target, consuming all of its Burn and all of the user's Fervor. Deals heavy fire damage per Burn consumed, increased by 2% per Fervor consumed. If Flame Meteor kills its target, it detonates: every enemy within 5 meters gains half the Burn consumed."},
{t:33,n:"Living Inferno",g:["Active","Buff"],c:1,x:"For 15 seconds: Ember Bolt applies 3 Burn and splits into 2 bolts at no extra cost; Wildfire spreads to 4 enemies within 12 meters and no longer removes Burn from the original target; Fervor does not decay; and Immolate is active for the full duration. Passive: Burn cap increased to 20, and Fervor max increased to 50."}]},
{id:"cryomancer",n:"Cryomancer",c:"magic",r:"Common",ty:"Main Class Tree",sk:[
{t:1,n:"Frost Affinity",g:["Passive","Utility"],x:"Ice spells deal increased damage. Grants cold resistance and immunity to the user's own ice. Learn Frost Bullets: three bolts of ice (each a separate hit) whose size scales with ice spell damage. The three bolts together apply Chill only once per cast."},
{t:3,n:"Chill",g:["Passive","Control"],x:"Hits apply 1 Chill (max 10); ice spells apply 2 instead. Chill lasts 30 seconds, refreshed whenever a new stack is applied. Each Chill slows the target. At max Chill, the target Freezes: encased in ice and unable to act for 5 seconds, then immune to Freeze for 10 seconds."},
{t:6,n:"Ice Shaping",g:["Active","Utility"],x:"Shapes ice into any form, up to roughly the size of a small room. Up to 3 shapes can exist at once; each lasts 60 seconds or until broken."},
{t:9,n:"Rime",g:["Passive","Offense"],x:"Whenever an enemy gains Chill, the user gains 1 Rime (max 20). Each Rime grants +2% ice spell damage. Rime decays by 5 every 20 seconds while no enemy is Chilled."},
{t:11,n:"Deep Freeze",g:["Passive","Offense"],x:"Damage dealt to a Frozen target is stored in the ice instead. When the Freeze ends, stored damage is released at 150%."},
{t:14,n:"Frost Shell",g:["Active","Defense"],x:"Sheathes the user in shaped ice for 15 seconds, forming a barrier whose strength scales with ice spell damage and which stores all damage it absorbs. While the Shell holds, the user cannot be debuffed. When the Shell breaks or ends, it shatters, releasing its stored damage and applying 2 Chill to every enemy within 5 meters."},
{t:21,n:"Glacier Break",g:["Active","Damage"],x:"If the target is Frozen, ends its Freeze early and consumes all of the user's Rime, releasing all stored damage increased by 2% per Rime consumed and bursting into shards that apply 2 Chill to every enemy within 5 meters. If the target is not Frozen, consumes all of its Chill instead, dealing heavy ice damage per Chill consumed, and Freezes the target."},
{t:33,n:"Absolute Zero",g:["Active","Buff"],c:1,x:"For 30 seconds: ice projectiles grow greatly in size; targets Freeze at 3 Chill; each enemy that Freezes grants the user 5 Rime; Deep Freeze stores and releases damage at 200%; and Ice Shaping shapes and Frost Shell reform once at full strength when broken, at no cost. Passive: Chill cap increased to 15, and Rime max increased to 50."}]},
{id:"stormcaller",n:"Stormcaller",c:"magic",r:"Common",ty:"Main Class Tree",sk:[
{t:1,n:"Storm Affinity",g:["Passive","Utility"],x:"Lightning spells deal increased damage. Grants shock resistance and immunity to the user's own lightning. Learn Spark: a quick bolt whose velocity scales with attack speed or cast speed, whichever is higher. Chains to 1 nearby enemy (each a separate hit)."},
{t:3,n:"Static",g:["Passive","Offense"],x:"Hits apply 1 Static (max 20); lightning spells apply 2 instead. Static lasts 6 seconds, refreshed whenever a new stack is applied. Each Static increases all damage the target takes from the user by 0.5%."},
{t:6,n:"Overcharge",g:["Passive","Offense"],x:"Each hit on a target with Static grants 1 Charge (max 25); hitting multiple such targets grants 1 per target. Each Charge grants +1% lightning damage."},
{t:9,n:"Thunder Step",g:["Active","Mobility"],x:"Transforms into lightning and travels instantly to a point within 15 meters, striking every enemy along the path (each a separate hit)."},
{t:11,n:"Conduction",g:["Passive","Offense"],x:"Targets at max Static become Conductors. Any hit on a Conductor arcs to every other Conductor within 15 meters. Arcs are secondary hits and cannot cause further arcs. If a target is the only Conductor, hits on it deal +15% damage instead."},
{t:14,n:"Storm Body",g:["Active","Defense"],x:"For 15 seconds, the user becomes a Conductor, and whenever the user takes damage, lightning arcs from the user to every enemy within 10 meters, dealing 50% of the damage taken (secondary hits). The user also gains +30% evasion chance for the duration."},
{t:21,n:"Lightning Storm",g:["Active","Damage"],x:"For 10 seconds, lightning strikes every 0.5 seconds (each a separate hit), always targeting the enemy with the most Static, or the nearest enemy if none have Static."},
{t:33,n:"Tempest",g:["Active","Damage"],c:1,x:"Consumes all Charge to call down a colossal bolt on a target, dealing massive lightning damage per Charge consumed. The bolt then grounds out: every enemy within 10 meters takes 50% of the damage dealt and gains 2 Static. Passive: Charge max increased to 50, and Static cap increased to 40."}]},
{id:"conjurer",n:"Conjurer",c:"magic",r:"Uncommon",ty:"Main Class Tree",sk:[
{t:1,n:"Conjure Arms",g:["Active","Summon"],x:"Conjures a Formless mana blade that orbits the user for 60 seconds (max 3 blades). Whenever the user hits a target with an attack, each orbiting blade strikes that target once. Blades strike once per attack, not per hit. Blade strikes are secondary hits."},
{t:3,n:"Grasp",g:["Active","Utility"],x:"Pulls an orbiting blade into the user's hand for 20 seconds (or until released), where it becomes a weapon matching its Form: Formless is a light bladed weapon, Spear is a polearm, Hook is a light bladed weapon, and Buckler is a shield. A held blade doesn't count toward the blade limit."},
{t:6,n:"Reforge",g:["Active","Utility"],x:"Reshapes one blade into a Form. Each blade holds one Form at a time. Only one blade can be reforged every 5 seconds.",s:[["Spear","its strikes pierce through to a second target behind the first."],["Hook","its strikes drag the target slightly toward the user."],["Buckler","its strikes push the target slightly away from the user."]]},
{t:9,n:"Guarding Blades",g:["Passive","Defense"],x:"While 3+ blades are orbiting, the first attack against the user every 8 seconds is intercepted by a blade, which is destroyed instead. Buckler blades intercept first, and lose their Form instead of being destroyed."},
{t:11,n:"Mirrored Edge",g:["Passive","Offense"],x:"Blade strikes carry the user's weapon buffs and on-hit effects."},
{t:14,n:"Shatter",g:["Active","Utility"],x:"Destroys one blade for an effect based on its Form. Spear: fires as a piercing lance through every target in a line. Hook: yanks the target hard toward the user and staggers it. Buckler: grants the user a barrier equal to 10% of max HP. Formless: a burst of damage around the user."},
{t:21,n:"Recast",g:["Passive","Utility"],x:"Blade max increased to 5. Whenever a blade is destroyed by Shatter or Guarding Blades, a new Formless blade is conjured 5 seconds later."},
{t:33,n:"Infinite Armory",g:["Active","Buff"],c:1,x:"For 15 seconds, a new blade is conjured every second in a Form of the user's choice (up to 12 blades); the extra blades vanish when the effect ends. Passive: blade max increased to 8."}]},
{id:"reactor",n:"Reactor",c:"magic",r:"Uncommon",ty:"Main Class Tree",sk:[
{t:1,n:"Reactor Core",g:["Passive","Utility"],x:"Spells deal increased damage. Grants resistance to explosions. Learn Discharge Bolt: a crackling bolt of raw energy whose velocity scales with attack speed."},
{t:3,n:"Instability",g:["Passive","Offense"],x:"Hits apply 4 Instability (max 100). Each Instability grants +0.5% damage. Instability cools by 4 per second after 3 seconds without casting. At 100, the user Melts Down: an explosion deals heavy damage to everyone within 6 meters, including allies and the user (25% of the user's max HP), and Instability resets to 0."},
{t:6,n:"Critical Mass",g:["Passive","Offense"],x:"While at 70+ Instability, the user's spells explode on impact, damaging enemies within 2 meters (secondary hits)."},
{t:9,n:"Release Valve",g:["Active","Damage"],x:"Vents half of current Instability in a cone of superheated energy, dealing damage per Instability vented. If used at 80+ Instability, the damage is doubled. Afterward, Instability cannot cool for 15 seconds."},
{t:11,n:"Chain Reaction",g:["Passive","Offense"],x:"Enemies killed by the user's explosions or Meltdowns detonate, damaging enemies within 3 meters."},
{t:14,n:"Containment Field",g:["Active","Defense"],x:"For 12 seconds, the user is surrounded by a barrier whose strength scales with current Instability. Meltdown damage to the user and allies is absorbed by the field first; any damage beyond its strength still goes through."},
{t:21,n:"Overload",g:["Active","Buff"],x:"Instantly sets Instability to 90. For 10 seconds, Instability does not cool, each spell cast adds 20 Instability instead of 10, and Meltdowns deal double damage."},
{t:33,n:"Supercritical",g:["Active","Buff"],c:1,x:"For 20 seconds, Instability max is increased to 200, and Meltdowns reset Instability to 50 instead of 0 and do not damage the user. Passive: Meltdown self-damage is halved, and its radius is increased to 8 meters."}]},
{id:"mycomancer",n:"Mycomancer",c:"magic",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Fungal Affinity",g:["Passive","Utility"],x:"Spore spells deal increased damage. Grants immunity to toxins and to the user's own spores. Learn Spore Shot: a puff of spores that drifts toward a target and applies 25% Infection."},
{t:3,n:"Infection",g:["Passive","Offense"],x:"Hits apply 5% Infection to the target (max 100%). Infection lasts 20 seconds, refreshed whenever more is applied. Every 10% Infection makes the target take +2% spore damage."},
{t:6,n:"Mycelium",g:["Passive","Utility"],x:"Mycelium grows on the ground wherever the user stands for 2 seconds, in a 5-meter radius, and stays in place for 30 seconds. While on Mycelium, the user gains increased mana regeneration and cast speed, and enemies on it gain 5% Infection per second."},
{t:9,n:"Cultivate",g:["Active","Summon"],x:"Grows a mushroom on Mycelium (max 5), choosing its type. Mushrooms wither if their Mycelium disappears.",s:[["Puffcap","bursts when an enemy steps near it, applying 40% Infection to everyone within 3 meters."],["Spitter","fires Spore Shots at the nearest enemy every 2 seconds."],["Glowcap","lights the area and slowly heals allies within 4 meters."]]},
{t:11,n:"Maturation",g:["Passive","Utility"],x:"Every 10 seconds a mushroom lives, it gains 1 Maturity (max 2). Each Maturity strengthens it: Puffcaps gain +1 meter of burst radius and apply +10% Infection, Spitters fire 25% faster, and Glowcaps heal 30% more. Each mushroom also spreads Mycelium in a 3-meter radius around itself."},
{t:14,n:"Creeping Growth",g:["Active","Utility"],x:"For 20 seconds, all of the user's Mycelium gathers beneath them and becomes a living territory: it moves with the user, carrying every mushroom on it, and its radius grows by 1 meter every second (up to 15 meters). Enemies on the Mycelium are slowed by 15%, and the user takes 15% less damage while standing on it. When the effect ends, the Mycelium stays in place at its full size for 10 seconds, then shrinks back to normal."},
{t:21,n:"Deathcap",g:["Active","Summon"],x:"Grows a giant Deathcap on Mycelium for 15 seconds (max 1). Every 2 seconds, it releases a spore pulse that applies 15% Infection to enemies within 6 meters and deals spore damage that scales with each target's Infection. When the Deathcap expires or is destroyed, it collapses, dealing heavy damage to every enemy within 6 meters and leaving behind a 6-meter patch of Mycelium."},
{t:33,n:"Fairy Ring",g:["Active","Buff"],c:1,x:"Grows a ring of mushrooms 10 meters around the user for 30 seconds. Inside the ring, Mycelium covers the ground, new mushrooms are grown at full Maturity, enemies gain 10% Infection per second, and the user's hits apply double Infection. Passive: mushroom max increased to 8, Mycelium radius increased to 8 meters, and Maturity max increased to 5."}]},
{id:"spellthief",n:"Spellthief",c:"magic",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Disrupt",g:["Active","Damage"],x:"A short-range burst that deals triple damage to barriers. If it breaks a barrier, the target is Silenced for 1 second and the user steals 1 Aether. 8-second cooldown. Unlocks Aether: amount of stolen magic (max 5)."},
{t:3,n:"Magebane",g:["Passive","Offense"],x:"Hits deal +15% damage to targets with a barrier or any magical effect on them."},
{t:6,n:"Pilfer",g:["Active","Utility"],x:"Steals one magical buff or barrier from an enemy within 10 meters and applies it to the user for its remaining duration. If the stolen magic is elemental, the user's attacks also carry its element and status while it lasts. Magic that can't be used is converted into 2 Aether instead."},
{t:9,n:"Siphon",g:["Active","Damage"],x:"A bolt that consumes all Aether and drains the target's mana instead of HP, draining 10% more per Aether consumed. The user restores mana equal to half the amount drained. A target reduced to 0 mana is Silenced for 3 seconds and deals 15% less damage for 10 seconds. Targets without mana take the damage to HP instead."},
{t:11,n:"Suppression Field",g:["Active","Control"],x:"For 8 seconds, enemy spells cast within 8 meters of the user take 50% longer to cast, and each enemy spell completed inside the field grants the user 1 Aether."},
{t:14,n:"Spellfire",g:["Passive","Offense"],x:"The user's attacks deal +3% damage per Aether held. Skills that consume Aether gain double this bonus."},
{t:21,n:"Heist",g:["Active","Utility"],x:"Strips every magical effect from a target. The user can keep one of them, every other effect stolen becomes 1 Aether."},
{t:33,n:"Antimagic",g:["Active","Control"],c:1,x:"For 10 seconds, every enemy within 10 meters has its magic suppressed: its buffs, barriers, and conjured objects stop working, and spells deal 50% less damage. When Antimagic begins, the user gains 1 Aether for each effect suppressed. Passive: Aether max increased to 10, and Pilfer steals an extra buff."}]},
{id:"debtcaster",n:"Debtcaster",c:"magic",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Credit",g:["Passive","Utility"],x:"Unlocks Debt: active skills cost no mana; their cost is added to Debt instead. The user's Credit Limit is equal to their max mana. Every 5 seconds, Debt gains 10% interest. Debt comes Due when it exceeds the Credit Limit, or 45 seconds after the user first borrows. When Due, Debt is collected from mana first, then HP. Anything left unpaid becomes Default: all stats reduced by 1% per 1% of max mana unpaid (max -50%). Mana regeneration pays down Debt automatically."},
{t:3,n:"Paying Up",g:["Active","Damage"],x:"A heavy mana projectile with a high cost. Damage scales with the Debt held when cast."},
{t:6,n:"Leverage",g:["Passive","Offense"],x:"All attacks deal bonus damage scaling with Debt as a percentage of the Credit Limit (max +40% at 100%)."},
{t:9,n:"Credit Rating",g:["Passive","Utility"],x:"Unlocks Credit Rating (0 to 10, starting at 5). Rating persists between fights and resets to 5 after a long rest.",s:[["","Paying off all Debt before it comes Due: +1 Rating."],["","Debt collected from HP: -1 Rating. Default: -3 Rating."],["","Each Rating above 5: +10% Credit Limit and +4% Leverage cap."],["","Each Rating below 5: -10% Credit Limit and +2% interest per tick."],["","At 8+ Rating, each interest tick grants +3% spell damage for 10 seconds (stacking)."],["","At 0 Rating, the user cannot borrow. Rating recovers by 1 every 60 seconds without a Default."]]},
{t:11,n:"Settle",g:["Active","Utility"],x:"Pays off Debt with HP at a discount (1 HP pays 1.5 Debt) and resets the Due timer. Perfect Payment: paying off all Debt within the final 3 seconds before it comes Due grants +1 additional Rating, and Leverage keeps its current bonus for 5 seconds."},
{t:14,n:"Foreclosure",g:["Active","Curse"],x:"Transfers up to 50% of current Debt onto a target as a Lien. The Lien gains interest like Debt, and when it comes Due, the target takes damage equal to it. If the target dies while holding a Lien, the user's remaining Debt is reduced by the Lien's amount and the user gains +1 Rating."},
{t:21,n:"Bankruptcy",g:["Active","Damage"],x:"Converts all Debt into a massive burst of damage in a chosen direction, scaling with both Debt and Credit Rating. Afterward, the user is in Default for 20 seconds (all stats -30%), cannot borrow during that time, and Credit Rating drops to 0."},
{t:33,n:"Infinite Credit",g:["Active","Buff"],c:1,x:"For 15 seconds, Debt has no limit, gains no interest, and cannot come Due. When the effect ends, all Debt comes Due immediately. If it is paid in full, the user gains +3 Rating. Passive: Credit Rating max increased to 15."}]},
{id:"archmage",n:"Archmage",c:"magic",r:"Legendary",ty:"Main Class Tree",sk:[
{t:1,n:"Arcane Mastery",g:["Passive","Offense"],x:"All active skills, from any tree, deal increased damage. Spells cost less mana. Learn Arcane Bolt: a fast arcane projectile whose velocity scales with attack speed and cast speed.",f:[["0-4","Bolt","a single projectile."],["5-9","Seeker Bolt","splits into 3 bolts that home in on enemies.","+10% cast speed."],["10","Arcane Comet","a large homing comet.","+15% cast speed."]]},
{t:3,n:"Ascension",g:["Passive","Offense"],x:"Every spell cast grants 1 Attunement; casting a different spell than the previous one grants 2 instead. Attunement is spent automatically to ascend Circles: Circles 1-4 cost 5 each, Circles 5-9 cost 10 each, and Circle 10 costs 15. Each Circle grants +3% spell damage and +3% cast speed. Every skill in this tree changes form as Circles rise, and a form's passive applies only while the user holds enough Circles for that form. The 10th Circle is unstable and is lost 20 seconds after it is reached. Every 45 seconds, remove one Circle.",s:[["Descend","spend 1 Circle to instantly reset the cooldown of one skill in this tree, or to cast the next spell from any tree instantly. Once every 15 seconds; cannot affect capstones."]]},
{t:6,n:"Arcane Missiles",g:["Active","Damage"],x:"Launches homing missiles at a target or area (each a separate hit). Additional missiles are secondary hits, cannot launch further missiles, and can launch at most once every 0.5 seconds.",f:[["0-4","Volley","3 missiles, each seeking a different enemy if available."],["5-9","Storm","6 missiles that pierce through enemies and explode in a small area on impact.","spell hits have a 15% chance to launch an additional homing missile."],["10","Nova Volley","9 larger missiles that home, pierce, and explode.","spell hits have a 30% chance to launch an additional homing missile."]]},
{t:9,n:"Encore",g:["Active","Buff"],x:"The next spell the user casts, from any tree, is cast again at the same moment. Echoes do not consume resources, grant Attunement, or count as casts. Only spells the user casts can be echoed; Encore cannot echo itself, Arcane Torrent, or capstones.",f:[["0-4","Echo","1 echo at 35% effect."],["5-9","Chorus","1 echo at 80% effect, which can be aimed at a different target.","every 10th spell the user casts is echoed once at 40% effect for free."],["10","Perfect Echo","2 echoes at 50% effect each, each aimed separately.","every 7th spell the user casts is echoed once at 40% effect for free."]]},
{t:11,n:"Counterspell",g:["Active","Utility"],x:"Negates an incoming spell or magical effect. A successful Counterspell grants 5 Attunement and restores mana.",f:[["0-4","Nullify","the spell is negated."],["5-9","Reflect","the negated spell is cast back at its caster at 75% effect.","the user takes 10% less damage from spells."],["10","Dominion","the negated spell is cast back at full effect, Counterspell's cooldown resets, and the spell is stolen: it becomes a known spell for 60 seconds, castable once. Capstones cannot be stolen."]]},
{t:14,n:"Singularity",g:["Toggle","Damage"],x:"Switches between two modes. The user is always in one of them. Switching has a 15-second cooldown. Mass: a stack on enemies (max 10 per target), applied only in Eclipse, that lasts 20 seconds and is refreshed whenever a new stack is applied.",s:[["Eclipse","the user's hits, from any tree, apply 1 Mass. Each Mass slows the target by 1.5%. The user's mana regeneration is increased by 50%, but their spell damage is reduced by 25%."],["Flare","the user's hits against a target with Mass consume 1 Mass, dealing bonus damage and granting 1 Attunement. The user gains +15% cast speed, but their mana regeneration is reduced by 50%."]],f:[["0-4","Rift","Mass max increased to 15. Enemies with 10+ Mass deal 10% less damage to the user."],["5-9","Collapse","Mass max increased to 20. In Eclipse, enemies within 4 meters are slowly drawn toward any target with 10+ Mass. Switching into Flare makes every target with 10+ Mass Collapse: it bursts outward, dealing damage per Mass to every enemy within 6 meters and knocking them back.","Mass lasts 30 seconds."],["10","Big Bang","Mass has no cap. Switching into Flare while enemies hold 100+ total Mass triggers the Big Bang instead of Collapse: all Mass implodes into a single point, dragging every enemy within 15 meters with it, then detonates for massive damage, consuming all Mass."]]},
{t:21,n:"Arcane Torrent",g:["Active","Buff"],x:"For 10 seconds, every spell the user casts, from any tree, also fires the user's current Arcane Bolt form at its target for free. Free bolts do not count as casts and do not grant Attunement. Arcane Torrent's cooldown cannot be reset.",f:[["0-4","Surge","free bolts deal 50% increased damage."],["5-9","Flood","Attunement gained is doubled, and Descend has no cooldown for the duration."],["10","Maelstrom","spells cost no mana for the duration, and the duration is extended to 15 seconds."]]},
{t:33,n:"Starfall",g:["Active","Damage"],c:1,x:"Consumes all Circles to call down the stars: for 3 seconds, falling stars rain on a 10-meter area, striking every enemy inside twice per second (each a separate hit) for massive damage per Circle consumed. Leftover Attunement is kept. Passive: unlocks the 10th Circle and each skill's final form, and Arcane Mastery's damage bonus is doubled."}]},

/* ---- SUPPORT ---- */
{id:"cleric",n:"Cleric",c:"support",r:"Common",ty:"Main Class Tree",sk:[
{t:1,n:"Minor Heal",g:["Active","Healing"],x:"Heals the user or an ally."},
{t:3,n:"Purge",g:["Active","Utility"],x:"Removes debuffs from the user or an ally and hurls them onto a nearby enemy."},
{t:6,n:"Radiance",g:["Passive","Utility"],x:"Unlocks Radiance: healing done builds Radiance (max 100)."},
{t:9,n:"Blessing",g:["Passive","Defense"],x:"Unlocks Blessing: healing beyond max HP becomes Blessing, a barrier (max 20% of max HP)."},
{t:11,n:"Smite",g:["Active","Damage"],x:"Consumes Radiance to deal holy damage to a target, healing the user for a portion of damage dealt."},
{t:14,n:"Vitality",g:["Passive","Defense"],x:"Healing received is increased by 25%."},
{t:21,n:"Martyr's Vow",g:["Active","Defense"],x:"For 8 seconds, damage dealt to nearby allies is redirected to the user. Healing the user receives during this time is doubled."},
{t:33,n:"Miracle",g:["Active","Healing"],c:1,x:"Consumes all Radiance to fully heal all allies in a wide area and grant them max Blessing. Passive: heals can critically heal."}]},
{id:"barrier_master",n:"Barrier Master",c:"support",r:"Uncommon",ty:"Main Class Tree",sk:[
{t:1,n:"Lifeshield",g:["Active","Defense"],x:"Converts a chosen amount of current HP into a barrier 150% as strong, placed on the user or an ally. Cannot reduce the user's HP below 10% of max HP. Lifeshield barriers decay over 20 seconds. Unlocks Properties: barrier effects, each learned as its own skill. Up to 2 Properties can be applied to barriers at once."},
{t:3,n:"Surging",g:["Property","Offense"],x:"The protected target deals increased damage the more the barrier is depleted, reaching maximum just before it breaks."},
{t:6,n:"Siphon",g:["Property","Healing"],x:"While the barrier holds, a portion of damage dealt by the protected target restores their HP."},
{t:9,n:"Mending",g:["Property","Healing"],x:"When the barrier breaks or expires, the protected target recovers HP equal to 50% of the damage it absorbed."},
{t:11,n:"Rupture",g:["Property","Damage"],x:"When the barrier breaks, it explodes, damaging and knocking back nearby enemies. Damage scales with the barrier's original strength."},
{t:14,n:"Layered Weave",g:["Passive","Utility"],x:"Up to 3 Properties can be applied to barriers at once."},
{t:21,n:"Shared Barrier",g:["Property","Utility"],x:"The barrier is shared between the protected target and up to 3 nearby allies. Damage to any of them depletes the same barrier, and all Properties apply to everyone linked."},
{t:33,n:"Resurgence",g:["Property","Defense"],c:1,x:"When the barrier breaks, it instantly reforms once at 50% strength, costing no HP. Passive: Lifeshield converts HP at 200% strength, and up to 4 Properties can be applied at once."}]},
{id:"sequencer",n:"Sequencer",c:"support",r:"Uncommon",ty:"Main Class Tree",sk:[
{t:1,n:"Compile",g:["Active","Utility"],x:"Compiles an active skill the user knows, from any tree, into a Program. The skill's full cost is paid upfront, and its cooldown starts. The Program is stored in the Queue (1 slot) and runs after a chosen Delay (1 to 10 seconds) at a chosen target or location, with no cast time. Programs run even if the user is stunned, silenced, or knocked down. Non-spell skills are performed by a mana projection of the user at the target, using the user's current weapon. Skills with timing windows and capstones cannot be compiled."},
{t:3,n:"Ping",g:["Active","Damage"],x:"A fast arcane bolt that marks the target as Targeted for 10 seconds. Programs aimed at the Targeted enemy follow it wherever it moves."},
{t:6,n:"Queue",g:["Passive","Utility"],x:"Queue slots increased to 3. Programs can be set to run in sequence, with each Delay counting from the end of the previous Program."},
{t:9,n:"Execute",g:["Active","Utility"],x:"Immediately runs the next Program in the Queue, skipping its remaining Delay."},
{t:11,n:"Conditional",g:["Passive","Utility"],x:"Programs can wait for a Condition instead of a Delay, running as soon as it becomes true. Conditions can be set freely, as long as they describe something observable. Conditions cannot depend on intentions, thoughts, or future events. If the Condition isn't met within 30 seconds, the Program expires."},
{t:14,n:"Loop",g:["Passive","Utility"],x:"When compiling, a Program can be set to Loop, running up to 3 additional times after the same Delay each time. The cost of every run is paid upfront at a 20% discount. A Looping Program takes up only one Queue slot."},
{t:21,n:"Synchronize",g:["Passive","Offense"],x:"Programs that run within 0.5 seconds of each other gain +15% effectiveness for each other Program in that window (max +90%)."},
{t:33,n:"Fork Process",g:["Active","Buff"],c:1,x:"For 15 seconds, every Program that runs is forked: an identical copy runs at the same moment on the same target. Copies cost nothing, count toward Synchronize, and cannot be forked again. Passive: Queue slots increased to 5, and Delays can be set up to 30 seconds."}]},
{id:"graviturgist",n:"Graviturgist",c:"support",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Gravity Affinity",g:["Passive","Utility"],x:"The user's own weight can be adjusted at will. Lighter grants faster movement and higher jumps; heavier grants knockback resistance."},
{t:3,n:"Push and Pull",g:["Active","Control"],x:"Pulls a target or object toward the user, or pushes it away."},
{t:6,n:"Weight",g:["Passive","Control"],x:"Unlocks Weight: hits apply 1 Weight (max 5). Each Weight slows the target and increases damage it takes from displacement (knockbacks, pulls, and pushes). At 5 Weight, the target is Grounded: unable to jump, fly, or dash for 3 seconds."},
{t:9,n:"Lighten",g:["Active","Buff"],x:"Makes the user or an ally nearly weightless for 15 seconds, greatly increasing movement speed and jump height and slowing falls."},
{t:11,n:"Well",g:["Active","Control"],x:"Creates a gravity well at a location that drags all nearby enemies toward its center for 4 seconds, applying Weight."},
{t:14,n:"Collision",g:["Passive","Control"],x:"Enemies that collide with each other or with walls because of the user's skills are staggered for 1 second."},
{t:21,n:"Shift",g:["Active","Control"],x:"Swaps the positions of any two targets within range, including allies and the user. Targets stronger than the user resist Shift unless Grounded."},
{t:33,n:"Event Horizon",g:["Active","Control"],c:1,x:"For 10 seconds, the user becomes a center of gravity: nearby enemies are constantly pulled in and gain 1 Weight per second. Passive: Weight cap increased to 10."}]},
{id:"hexer",n:"Hexer",c:"support",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Curse Affinity",g:["Passive","Utility"],x:"Debuffs applied by the user, from any tree, last longer. Curses can be applied to any target, including the user and allies. Unlocks Afflictions: each different debuff on a target counts as 1 Affliction, regardless of who applied it."},
{t:3,n:"Frailty",g:["Active","Curse"],x:"The target takes increased damage from all sources."},
{t:6,n:"Malediction",g:["Passive","Offense"],x:"Each Affliction on a target increases the damage it takes from all sources by 5% (counts up to 8 Afflictions)."},
{t:9,n:"Deepen",g:["Active","Curse"],x:"Adds 1 stack to every stacking debuff on a target."},
{t:11,n:"Contagion",g:["Passive","Utility"],x:"When an afflicted target dies, all of its debuffs spread to nearby enemies."},
{t:14,n:"Leech",g:["Active","Damage"],x:"Drains HP from a target, draining more for each Affliction on it."},
{t:21,n:"Doom",g:["Active","Curse"],x:"After 8 seconds, the target takes a portion of all damage dealt to it during that time again. The portion increases with each Affliction on it."},
{t:33,n:"Plague",g:["Active","Curse"],c:1,x:"Copies every debuff on a target onto all enemies in a wide area. Copied debuffs keep their stacks but not stored damage (a copied Doom starts a fresh 8-second timer). Passive: Malediction bonus per Affliction is doubled."}]},
{id:"spirit_caller",n:"Spirit Caller",c:"support",r:"Rare",ty:"Main Class Tree",sk:[
{t:1,n:"Spirit Bond",g:["Passive","Offense"],x:"Four spirits orbit the user in a fixed rotation. Every 10 seconds, the next spirit takes its turn and imbues the user's weapon: weapon hits deal bonus elemental damage and apply 1 stack of that spirit's status.",s:[["Fire Wisp","Burn."],["Frost Wisp","Chill."],["Thunder Wisp","Static."],["Stone Wisp","Weight."]]},
{t:3,n:"Command",g:["Active","Utility"],x:"Either Holds the current spirit for 5 more seconds, or Skips to the next spirit in the Rotation."},
{t:6,n:"Bestow",g:["Active","Buff"],x:"Attaches one spirit to an ally within 15 meters for 60 seconds, or until recalled. The spirit leaves the user's Rotation and permanently imbues the ally's weapon with its status and on-hit damage, and the ally gains its Blessing. The user also gains each spirit's Blessing during its own turn. Max 1 attached spirit.",s:[["Fire Wisp","+15% attack power."],["Frost Wisp","+10% damage reduction."],["Thunder Wisp","+15% attack speed."],["Stone Wisp","immunity to stagger."]]},
{t:9,n:"Convergence",g:["Passive","Offense"],x:"Hitting the same target with every spirit's element within one full Rotation triggers a Convergence: a burst of damage per status stack on the target, and applying 1 stack of each status to enemies within 4 meters. Hits from allies carrying an attached spirit count toward it. Can trigger once per target per Rotation."},
{t:11,n:"Parting Gift",g:["Passive","Offense"],x:"When a spirit's turn ends, or an attached spirit returns to the user, the next weapon hit releases a Parting Gift.",s:[["Fire Wisp","a burst of flame around the target."],["Frost Wisp","applies 3 additional Chill."],["Thunder Wisp","an arc that strikes 2 nearby enemies, inflicting Static."],["Stone Wisp","a heavy stagger."]]},
{t:14,n:"Guardian Spirit",g:["Active","Defense"],x:"A spirit shields the user or an ally within 15 meters for 8 seconds. The user's current spirit shields the user; an attached spirit shields the ally carrying it.",s:[["Fire Wisp","enemies that hit the protected target gain 2 Burn."],["Frost Wisp","a barrier that applies Chill to attackers."],["Thunder Wisp","+10% evasion chance."],["Stone Wisp","+10% damage reduction."]]},
{t:21,n:"Spirit Merge",g:["Active","Buff"],x:"The user fuses with their current spirit, or an ally fuses with their attached spirit, for 10 seconds. The merged person's attacks change based on the spirit. When the Merge ends, the spirit is Exhausted: it skips its next turn in the Rotation, or if attached, returns to the user.",s:[["Fire Wisp","movement leaves a trail of fire that applies Burn, and weapon hits explode in a small area (secondary hits)."],["Frost Wisp","the ground within 3 meters freezes into ice that slows enemies, and hits against Frozen targets shatter the ice, dealing burst damage and applying 2 Chill to nearby enemies."],["Thunder Wisp","can dash instantly to any enemy with Static within 10 meters, once per second, striking it on arrival."],["Stone Wisp","grows larger, gaining weapon reach and immunity to knockback."]]},
{t:33,n:"Spirit Chorus",g:["Active","Buff"],c:1,x:"For 15 seconds, all four spirits are active at once for the user and every ally carrying an attached spirit: weapon hits apply every spirit's status, every Blessing applies, and Convergence can trigger on each target every 3 seconds. Passive: up to 2 spirits can be attached at once, the Rotation advances every 4 seconds, and Parting Gifts are 50% stronger."}]},
{id:"skillmaster",n:"Skillmaster",c:"support",r:"Legendary",ty:"Main Class Tree",sk:[
{t:1,n:"Tutelage",g:["Active","Buff"],x:"Lends one of the user's non-capstone active skills to an ally within 15 meters for 30 seconds. The ally can use it once, using their own stats. The user's copy of the skill goes on cooldown while it is lent."},
{t:3,n:"Codex",g:["Passive","Utility"],x:"Whenever an ally within 15 meters uses a non-capstone active skill, the user can Record it in their Codex (max 3; the oldest is replaced). Recorded skills can be lent with Tutelage, and the user can use each Recorded skill themselves once per fight at 15% increased effect."},
{t:6,n:"Mentor's Eye",g:["Passive","Offense"],x:"Lent skills are used at +10% effect."},
{t:9,n:"Lecture",g:["Active","Buff"],x:"For 15 seconds, allies within 10 meters gain +15% effect on skills."},
{t:11,n:"Annotate",g:["Passive","Utility"],x:"When lending a skill, the user can add one Annotation: +50% range, +30% area, or no cost."},
{t:14,n:"Lesson Learned",g:["Active","Defense"],x:"For 30 seconds, the user and allies within 10 meters take 30% less damage from any enemy skill that has already hit one of them this fight."},
{t:21,n:"Masterclass",g:["Active","Buff"],x:"Grants an ally every passive skill the user has in one chosen tree (capstones excluded) for 20 seconds. Passives the ally already has are not duplicated."},
{t:33,n:"Bequest",g:["Active","Buff"],c:1,x:"Lends an ally one of the user's skill trees, with every skill the user has unlocked in it except the capstone, as a temporary fourth tree for 30 seconds. Passive: the Codex holds 6 skills, and Tutelage can lend to 2 allies at once."}]},
{id:"chef",n:"Chef",c:"support",r:"Common",ty:"Main Class Tree",sk:[
{t:1,n:"Cooking",g:["Passive","Utility"],x:"The user can cook Meals from monster materials. A Meal grants a buff for 1 hour based on its Flavor, and each person can only have one Meal active at a time. Meal strength scales with the user's level. Learn Field Snack: a quick bite that restores a small amount of HP and stamina, usable in combat."},
{t:3,n:"Flavors",g:["Passive","Utility"],x:"Meals take a Flavor based on their main ingredient.",s:[["Hearty","increased max HP."],["Spicy","increased attack power and spell damage."],["Warming","cold resistance and stamina recovery."],["Cooling","heat resistance and cast speed."],["Energizing","movement speed and attack speed."]]},
{t:6,n:"Snack Pack",g:["Active","Buff"],x:"Prepares up to 3 Snacks to carry. A Snack can be eaten instantly or tossed to an ally within 10 meters, granting the Flavor of the user's current Meal at double strength for 15 seconds."},
{t:9,n:"Taste Test",g:["Passive","Utility"],x:"The user can identify whether any monster material is edible and what it does. Eating a monster material raw grants a minor buff tied to that monster's nature for 5 minutes (a salamander's tail grants fire resistance, a stalker's eye grants night vision)."},
{t:11,n:"Full Course",g:["Passive","Utility"],x:"Meals can combine 2 Flavors."},
{t:14,n:"Comfort Food",g:["Active","Defense"],x:"For 12 seconds, the user and allies within 5 meters regenerate HP and have one debuff removed every 4 seconds."},
{t:21,n:"Signature Dish",g:["Active","Utility"],x:"Once per day, cooks a Signature Dish: a Meal with 3 Flavors at +50% strength."},
{t:33,n:"Feast",g:["Active","Buff"],c:1,x:"Lays out a feast for 30 seconds. Every ally within 8 meters gains all Flavors at double strength for as long as the feast lasts, plus 10 seconds. Passive: Meals last 3 hours, and Full Course allows 3 Flavors."}]},
{id:"quartermaster",n:"Quartermaster",c:"support",r:"Common",ty:"Main Class Tree",sk:[
{t:1,n:"Logistics",g:["Passive","Utility"],x:"Greatly increases carrying capacity. The user gains 2 extra consumable slots, and consumables they carry never degrade."},
{t:3,n:"Resupply",g:["Active","Utility"],x:"Tosses a consumable, ammunition, or a spare weapon to an ally within 15 meters. The ally can use or equip it instantly, and ammunition reloads them fully on catch."},
{t:6,n:"Quick Hands",g:["Passive","Utility"],x:"The user swaps weapons, reloads, and uses consumables twice as fast."},
{t:9,n:"Supply Cache",g:["Active","Utility"],x:"Drops a supply cache for 60 seconds. Allies who touch it fully reload, can swap gear instantly, and take one consumable from the user's stock."},
{t:11,n:"Rationing",g:["Passive","Utility"],x:"Consumables used by the user, or supplied by the user to an ally, are 30% more effective."},
{t:14,n:"Emergency Kit",g:["Active","Defense"],x:"Instantly restores a portion of HP and stamina to the user or an ally, and removes slows and roots."},
{t:21,n:"Armory",g:["Passive","Offense"],x:"The user can carry up to 5 weapons without penalty. Switching weapons grants +10% damage for 3 seconds."},
{t:33,n:"Requisition",g:["Active","Buff"],c:1,x:"For 20 seconds, consumables and ammunition used by the user and allies within 15 meters are not consumed, and reloads are instant. Passive: consumable slots are doubled, and Resupply has no cooldown."}]},

/* ---- AUXILIARY ---- */
{id:"wither",n:"Wither",c:"auxiliary",r:"Common",ty:"Auxiliary Tree",sk:[
{t:1,n:"Festering",g:["Passive","Offense"],x:"Hits apply 1 Wither to the target (max 5), lasting 8 seconds and refreshed on each new stack. Each Wither reduces healing the target receives by 4%."},
{t:3,n:"Rotting Strike",g:["Active","Damage"],x:"A strike that applies 3 Wither."},
{t:6,n:"Unclean Wounds",g:["Passive","Offense"],x:"Damage over time on a Withered target deals bonus damage for each Wither."},
{t:9,n:"Denial",g:["Passive","Offense"],x:"20% of healing prevented by Wither is dealt to the target as damage instead."},
{t:11,n:"Gangrene",g:["Active","Curse"],x:"For 10 seconds, an additional 10% of all damage the target takes is applied to it as Rot."},
{t:14,n:"Lingering Rot",g:["Passive","Utility"],x:"Wither does not expire while the target has any damage over time on it."},
{t:21,n:"Necrosis",g:["Active","Damage"],x:"Consumes all Wither on a target, dealing damage per Wither consumed. The target cannot be healed at all for 1 second per Wither consumed."},
{t:33,n:"Rotbrand",g:["Active","Curse"],c:1,x:"Brands one target for 12 seconds. It cannot be healed at all, Denial deals 100% of prevented healing as damage (max 5% of the target's max HP per second), and Gangrene's Rot is doubled on it. Passive: Wither max increased to 10."}]},
{id:"gambler",n:"Gambler",c:"auxiliary",r:"Common",ty:"Auxiliary Tree",sk:[
{t:1,n:"Fortune",g:["Passive","Utility"],x:"Slightly increased critical chance and increased base Luck."},
{t:3,n:"Coin Flip",g:["Active","Buff"],x:"50% chance: the next active skill has double effect. Otherwise: it fails and goes on cooldown. Does not work on capstones."},
{t:6,n:"Lucky Break",g:["Passive","Defense"],x:"When the user would take a critical hit, 25% chance it becomes a normal hit."},
{t:9,n:"Karma",g:["Passive","Offense"],x:"Each failed chance roll (a non-critical hit, a failed evasion, a lost Coin Flip) grants 1 Karma (max 10). Non-critical hits grant Karma at most once per second. At 10 Karma, the next Coin Flip automatically succeeds and consumes all Karma."},
{t:11,n:"Jackpot",g:["Passive","Offense"],x:"Three critical hits in a row trigger a Jackpot: the next hit deals triple damage. Jackpot can trigger at most once every 5 seconds."},
{t:14,n:"Second Roll",g:["Passive","Utility"],x:"All of the user's chance-based effects roll twice and take the better result. Does not apply to Coin Flip."},
{t:21,n:"All In",g:["Active","Buff"],x:"Consumes all Karma. For 10 seconds, critical chance increases by 10% per Karma consumed."},
{t:33,n:"Destiny",g:["Active","Buff"],c:1,x:"For 8 seconds, every chance-based effect of the user succeeds, except evasion, which is set to 75%. Passive: Coin Flip success chance increased to 75%."}]},
{id:"quicksilver",n:"Quicksilver",c:"auxiliary",r:"Uncommon",ty:"Auxiliary Tree",sk:[
{t:1,n:"Light Feet",g:["Passive","Defense"],x:"+10% evasion chance. Each evasion grants a brief burst of movement speed."},
{t:3,n:"Feint",g:["Active","Utility"],x:"The next attack against the user within 2 seconds is automatically evaded."},
{t:6,n:"Drift",g:["Passive","Offense"],x:"Unlocks Drift: each evasion grants 1 Drift (max 10). Each Drift grants attack speed and movement speed. Drift decays by 1 every 2 seconds without an evasion, and resets when the user takes HP damage."},
{t:9,n:"Riposte",g:["Passive","Offense"],x:"After an evasion, the next hit within 2 seconds deals bonus damage and applies Off-Balance to the target for 5 seconds. Attacks from an Off-Balance target have +15% chance to be evaded."},
{t:11,n:"Spillover",g:["Passive","Offense"],x:"Evasion chance above the evasion cap converts into critical chance at a 1:1 rate."},
{t:14,n:"Threadneedle",g:["Active","Mobility"],x:"Weaves through up to 5 nearby enemies, hitting each once. Each enemy passed counts as an evasion."},
{t:21,n:"Counterflow",g:["Active","Damage"],x:"Consumes all Drift to unleash a flurry on one target, one hit per 2 Drift consumed. Every hit counts as a Riposte."},
{t:33,n:"Flicker",g:["Active","Defense"],c:1,x:"For 10 seconds, the user leaves afterimages. Any attack that would hit the user has a separate 50% chance to strike an afterimage instead, counting as an evasion. This ignores the evasion cap. Passive: Drift max increased to 20."}]},
{id:"mechanic",n:"Mechanic",c:"auxiliary",r:"Uncommon",ty:"Auxiliary Tree",sk:[
{t:1,n:"Tinkerer",g:["Passive","Utility"],x:"Unlocks Gadgets: mechanical devices the user builds and carries. Up to 4 Gadgets can be held ready at once. A Gadget is used up when deployed and is rebuilt after its cooldown."},
{t:3,n:"Mechanical Seeker",g:["Gadget","Damage"],x:"Deploys a kamikaze robot that moves on its own, seeks out a target, and explodes on contact. Its damage scales with the user's attack power. Lasts 30 seconds."},
{t:6,n:"Bouncing Mine",g:["Gadget","Control"],x:"Places a mine that lasts 1 minute. When an enemy steps on it, it explodes, knocking them up and sending out shrapnel."},
{t:9,n:"Rocket Propeller",g:["Gadget","Mobility"],x:"Straps on a propeller that allows quick vertical movement for 20 seconds. Takes up 2 Gadget slots."},
{t:11,n:"Air Compressor",g:["Gadget","Control"],x:"Throws a device that, when triggered, blasts nearby enemies 3 meters backward. Enemies knocked into terrain are staggered."},
{t:14,n:"Seeking Eye",g:["Gadget","Utility"],x:"Releases a tiny floating device that drifts away from the user. The user can see everything the Eye sees."},
{t:21,n:"Retrofit",g:["Passive","Utility"],x:"Rocket Propeller now takes up 1 Gadget slot, allows horizontal movement and lasts 1 minute. Bouncing Mine duration increases to 2 minutes."},
{t:33,n:"Masterwork",g:["Active","Buff"],c:1,x:"Combines two Gadgets into one Invention for 20 seconds: a single machine with both Gadgets' effects at double rate and durability. When the Invention ends, both Gadgets return ready. Long cooldown. Passive: up to 8 Gadgets can be held ready at once."}]},
{id:"opportunist",n:"Opportunist",c:"auxiliary",r:"Rare",ty:"Auxiliary Tree",sk:[
{t:1,n:"Opportunist",g:["Passive","Offense"],x:"Hits against a debuffed target deal bonus damage."},
{t:3,n:"Twist the Knife",g:["Active","Damage"],x:"A strike that makes every damage-over-time debuff on the target tick once instantly."},
{t:6,n:"Opening",g:["Passive","Offense"],x:"Unlocks Opening: each hit against a debuffed target grants 1 Opening (max 20). Each Opening grants attack speed and cast speed. Opening decays by 2 every 3 seconds without hitting a debuffed target."},
{t:9,n:"Aggravate",g:["Passive","Utility"],x:"Hits against a debuffed target extend all of its debuffs by 1 second (up to 10 seconds beyond their normal duration)."},
{t:11,n:"Pry",g:["Active","Utility"],x:"Consumes 10 Opening to add 2 stacks to every stacking debuff on the target. 10-second cooldown."},
{t:14,n:"Amplify",g:["Passive","Offense"],x:"Debuffs on the target being attacked are 1% stronger per Opening held."},
{t:21,n:"Exploit Weakness",g:["Active","Damage"],x:"Consumes all Opening for a strike that deals damage scaling with Opening consumed and the total debuff stacks on the target (counts up to 40 stacks). Does not consume the target's debuffs."},
{t:33,n:"Open Season",g:["Active","Buff"],c:1,x:"For 15 seconds, Opening does not decay, and every hit against a debuffed target adds 1 stack to its highest-stacked debuff (at most twice per second per target). Passive: Opening max increased to 30."}]},
{id:"challenger",n:"Challenger",c:"auxiliary",r:"Rare",ty:"Auxiliary Tree",sk:[
{t:1,n:"Ringcraft",g:["Passive","Offense"],x:"Unlocks Positions: Frontal, Behind, and Above. Unlocks Ringcraft: each hit from a different Position than the user's previous hit on that target grants 1 Ringcraft (max 10). Each Ringcraft grants 1% movement speed and 1% attack speed. Ringcraft decays by 1 every 4 seconds without a new Positional hit."},
{t:3,n:"Backstab",g:["Active","Damage"],x:"A strike from Behind deals heavy bonus damage and cannot be blocked or parried."},
{t:6,n:"Flanking Step",g:["Active","Mobility"],x:"A quick dash to the Frontal or Behind Position of a target within 3 meters."},
{t:9,n:"Head-On",g:["Passive","Offense"],x:"Hits against a target from the Frontal Position deal +10% damage, doubled for 2 seconds after that target attacks the user."},
{t:11,n:"High Ground",g:["Passive","Offense"],x:"Hits from Above deal bonus damage and stagger more. A hit from Above grants 2 Ringcraft instead of 1 (at most once every 3 seconds)."},
{t:14,n:"Pincer",g:["Active","Utility"],x:"Binds an ally for 10 seconds. While the user and the ally attack the same target, the user's hits on it count toward Ringcraft."},
{t:21,n:"Full Circle",g:["Active","Damage"],x:"A strike that consumes all Ringcraft, dealing damage per Ringcraft consumed. If the user has hit the target from all Positions within the last 10 seconds, the strike counts as 3 hits."},
{t:33,n:"Every Angle",g:["Passive"],c:1,x:"Ringcraft max is increased to 20, and Ringcraft decays by 1 every 8 seconds instead of every 4. The user's hits from Behind cannot trigger the target's retaliation effects. Flanking Step's cooldown is halved."}]},

/* ---- CURSED ---- */
{id:"penitent",n:"Penitent",c:"cursed",r:"Rare",ty:"Cursed Tree",cu:["Lingering Sin","Debuffs on the user last 50% longer and cannot be removed by other people's cleansing effects. The user's own skills can still remove them.",[]],sk:[
{t:1,n:"Relish",g:["Passive","Offense"],x:"Debuffs on the user grant bonuses instead of only harming them. Unlocks Boons for Burn and Bleed.",s:[["Burn","+2% attack power per stack."],["Bleed","1% lifesteal per stack."]]},
{t:3,n:"Self-Inflict",g:["Active","Utility"],x:"Applies 2 stacks of a chosen debuff the user can apply, from any tree, onto the user. If the user cannot apply any debuff, applies 2 Bleed to the user instead. Self-inflicted debuffs last 20 seconds (30 seconds with Lingering Sin)."},
{t:6,n:"Numb Nerves",g:["Passive","Defense"],x:"Damage over time on the user deals 50% less damage. Unlocks Boons for Chill and Static.",s:[["Chill","+2% damage reduction per stack. Chill on the user cannot Freeze them."],["Static","+4% attack speed and cast speed per stack."]]},
{t:9,n:"Sympathetic Pain",g:["Passive","Offense"],x:"Each time a debuff on the user ticks or gains a stack, the user stores 1 Sympathy of that debuff (max 5). Each hit spends 1 Sympathy to apply 1 stack of its debuff to the target."},
{t:11,n:"Scar Tissue",g:["Passive","Defense"],x:"Each different debuff on the user grants 3% damage reduction (counts up to 8 debuffs). Unlocks Boons for Weight, Condemn, defense reduction, and attack power reduction.",s:[["Weight","+3% damage per stack and knockback resistance. The user cannot be Grounded."],["Condemn","+2% critical chance per stack."],["Defense reduction","gain attack power equal to half the defense percentage lost."],["Attack power reduction","the reduction is removed and becomes attack speed of the same percentage."]]},
{t:14,n:"Fever Pitch",g:["Passive","Offense"],x:"While 5+ different debuffs are on the user, hits apply 1 stack of a random debuff currently on the user to the target."},
{t:21,n:"Exquisite Agony",g:["Active","Damage"],x:"Adds 1 stack to every stacking debuff on the user, then releases a burst that damages nearby enemies, scaling with total debuff stacks on the user. For 20 seconds afterward, all Boons are doubled."},
{t:33,n:"Catharsis",g:["Active","Buff"],c:1,x:"For 20 seconds, debuffs on the user deal no damage and have no negative effects, but still grant Boons. Passive: Sympathy max increased to 10."}]},
{id:"madness",n:"Madness",c:"cursed",r:"Rare",ty:"Cursed Tree",cu:["Madness","When Insanity reaches max, the user enters Madness for 20 seconds and loses either Sight or Hearing (random). Insanity stays at max during Madness, then resets to 0 when the sense returns.",[["Sight lost","the user cannot see, but is immune to gaze, glare, blinding, and illusion effects."],["Hearing lost","the user cannot hear, but is immune to Silence and sound-based effects."]]],sk:[
{t:1,n:"Insanity",g:["Passive","Offense"],x:"Each hit grants 1 Insanity (max 20); hits on multiple enemies grant 1 per enemy hit. Each Insanity grants +3% to a random stat, rolled when gained: attack power, attack speed, cast speed, movement speed, critical chance, or damage reduction."},
{t:3,n:"Howl of the Mad God",g:["Active","Control"],x:"Consumes 5 Insanity to either Stun or Silence (random) everyone within 5 meters of the user, allies included, for 2 seconds."},
{t:6,n:"Mania",g:["Active","Buff"],x:"Immediately grants 10 Insanity. Long cooldown."},
{t:9,n:"Lunacy",g:["Passive","Offense"],x:"Each Insanity grants +1% damage dealt and +1% damage taken."},
{t:11,n:"Laughter of the Mad God",g:["Active","Curse"],x:"Consumes 10 Insanity to inflict Hysteria on everyone within 5 meters, the user and allies included, for 5 seconds. Hysteria: +10% damage dealt, and the affected attack the nearest creature regardless of side."},
{t:14,n:"Frenzy",g:["Passive","Offense"],x:"Each time Insanity is gained, it has a chance equal to the user's critical chance (max 50%) to grant double its stat bonus."},
{t:21,n:"Realm of the Mad God",g:["Active","Utility"],x:"Consumes 10 Insanity to claim a 10-meter radius as the user's Realm for 30 seconds. Inside, the user's Insanity stops at 1 below max, and every creature inside, allies included, takes 1% increased damage per Insanity the user holds."},
{t:33,n:"The Mad God's Gift",g:["Active","Buff"],c:1,x:"Immediately fills Insanity and forces Madness, losing both Sight and Hearing for 20 seconds. During this Madness, all Insanity bonuses are tripled. Passive: Insanity max increased to 30."}]},
{id:"carnage",n:"Carnage",c:"cursed",r:"Rare",ty:"Cursed Tree",cu:["Price of Slaughter","While in combat, the user loses 1% of current HP per second. The drain increases by 1% every 20 seconds of continuous combat, up to 15% per second. If HP falls below 15% of max HP, all Overlord stacks are lost and no skill in this tree can be activated for 5 minutes.",[]],sk:[
{t:1,n:"Devour",g:["Active","Utility"],x:"The next 3 hits each restore HP equal to 5% of the user's missing HP (10% while below 25% HP). Each heal is capped at 15% of max HP."},
{t:3,n:"Malicious Blade",g:["Active","Buff"],x:"Consumes 10% of max HP. For 10 seconds, all hits deal their normal damage plus 25% of it as bonus true damage."},
{t:6,n:"Overlord",g:["Passive"],x:"Every enemy kill grants 1 Overlord stack (max 5). Each stack grants +3% to all stats, but each subsequent stack requires another kill within a shrinking window. While holding any Overlord stack, Price of Slaughter's drain is halved."},
{t:9,n:"Domination",g:["Active","Offense"],x:"Can only be activated at max Overlord stacks. Consumes all stacks to summon abyssal swords from the ground, damaging every enemy within a 5-meter radius. Each enemy hit restores 4% of the user's missing HP (total healing capped at 20% of max HP)."},
{t:11,n:"Soulrend",g:["Active","Offense"],x:"Consumes 15% of max HP to deal a devastating blow to a target. If Soulrend kills its target, the HP cost is refunded. Its cooldown resets to 0 whenever the user kills an enemy."},
{t:14,n:"Ego",g:["Active","Offense"],x:"Consumes 15% of max HP to summon a shadowed copy of the user for up to 20 seconds. Ego's stats are half of the user's current stats; it cannot be controlled and uses the user's skills and passives on its own. Ego requires at least 1 Overlord stack to summon and persists only while the user holds Overlord stacks. While Ego is active, Price of Slaughter's drain is halved."},
{t:21,n:"Selfless Ego",g:["Passive"],x:"Every time Ego kills an enemy, the user heals 10% of the slain enemy's max HP (capped at 10% of the user's max HP per heal)."},
{t:33,n:"God Shattering Star",g:["Active","Buff"],c:1,x:"Consumes 50% of current HP and transforms the user into an avatar of conquest for 30 seconds. A 5-meter aura drains 2% of max HP per second from every living being inside it; the user heals for 50% of all HP drained. During this time, Overlord stacks have no limit and Domination autocasts for free every 5 stacks gained."}]},
{id:"scourge",n:"Scourge",c:"cursed",r:"Rare",ty:"Cursed Tree",cu:["Profane Body","HP cannot regenerate naturally, and all healing the user would receive inflicts equal damage instead. Damage over time from any source heals the user instead.",[]],sk:[
{t:1,n:"Shared Rot",g:["Passive","Offense"],x:"Unlocks Blight. The user's hits apply 1 Blight to the target. While within 5 meters of the target, hits against a target already at max Blight spill over, giving the user 1 Blight. When an enemy with Blight dies within 5 meters, the user inhales its rot, gaining 2 Blight."},
{t:3,n:"Self-Desecration",g:["Active","Healing"],x:"The user cuts themselves, taking 15% of current HP as damage, then gains 2 Blight."},
{t:6,n:"Spite",g:["Passive","Offense"],x:"Damage the user takes from inverted healing is stored as Spite (max 30% of max HP). The user's next damage skill releases all Spite as bonus damage."},
{t:9,n:"Miasma",g:["Active","Control"],x:"Exhales a cloud of rot around the user for 8 seconds. Every creature within 5 meters, allies included, gains 1 Blight per second, and the user gains 1 Blight every 2 seconds while inside the cloud."},
{t:11,n:"Festering Vigor",g:["Passive","Offense"],x:"For each different damage over time effect on the user, they gain +10% damage, 5% evasion, and -5% movement speed (counts up to 5 effects)."},
{t:14,n:"Dormancy",g:["Active","Defense"],x:"For 8 seconds, all Blight on the user goes dormant, and each dormant stack grants 1% damage reduction (max 20%). When Dormancy ends, the Blight wakes and resumes healing with its remaining duration intact."},
{t:21,n:"Excise",g:["Active","Damage"],x:"Forcibly cleanses all Blight from every enemy within 8 meters, detonating each. The user draws back the rot, gaining 1 Blight for every 4 stacks detonated (up to their max)."},
{t:33,n:"Living Rot",g:["Active","Buff"],c:1,x:"For 20 seconds, each time a damage over time effect ticks on any creature within 15 meters, ally or enemy, the user gains 1 Blight. Passive: Spite max increased to 60% of max HP, Blight max increased to 20, and Miasma's radius is doubled."}]},
{id:"lycanthropy",n:"Lycanthropy",c:"cursed",r:"Rare",ty:"Cursed Tree",cu:["Lycanthropy","Outside Beast Form, all of the user's stats are reduced by 40%. In Beast Form, the user loses access to every other skill tree, but all of their stats are increased by 20%. The Beast cannot use items, cast magic, or receive buffs or debuffs from others.",[]],no:[["Form skills","Each Form skill has a Human half and a Beast half. Only the half matching the user's current form can be used."]],sk:[
{t:1,n:"Beast Form",g:["Active","Transformation"],x:"Transforms into the Beast, or back into human form. Transforming takes 5 seconds, during which the user cannot act, and either transformation has a 5-minute cooldown. The Beast's natural weapons count as unarmed attacks and light blades."},
{t:3,n:"Keen Senses",g:["Form","Offense"],x:"",h:[["Human","Track",["Active","Utility"],"Marks a target within 30 meters as Prey for 30 seconds. The user can sense Prey through walls and obstacles."],["Beast","Bloodhound",["Passive","Offense"],"Hits against Prey deal bonus damage, and Prey cannot hide from the Beast through stealth or displacement."]]},
{t:6,n:"Rend",g:["Form","Offense"],x:"",h:[["Human","Rend",["Passive","Offense"],"Hits against Prey apply 2 Bleed (max 10)."],["Beast","Rake",["Active","Damage"],"Three swipes, each applying 2 Bleed, doubled against Prey. Hits against a Bleeding target grant stacking attack speed for 5 seconds."]]},
{t:9,n:"Territory",g:["Form","Mobility"],x:"",h:[["Human","Scent Mark",["Active","Utility"],"Marks a spot on the ground for the rest of the fight (max 3 marks)."],["Beast","Run the Bounds",["Active","Damage"],"The Beast dashes through each Scent Mark in the order they were placed, striking every enemy along the path and applying 2 Bleed to each. The marks remain."]]},
{t:11,n:"Pack Hunt",g:["Form","Utility"],x:"",h:[["Human","Lure",["Active","Defense"],"Taunts every enemy within 30 meters, forcing them to target the user. For 30 seconds, the user takes 10% less damage from taunted enemies."],["Beast","Howl",["Active","Control"],"Every enemy within 15 meters is Weakened for 30 seconds (dealing 15% less damage), and the strongest among them becomes Prey. Allies within 15 meters gain +15% attack power for 15 seconds."]]},
{t:14,n:"Restraint",g:["Form","Defense"],x:"",h:[["Human","Bloodletting",["Active","Defense"],"The user cuts their palm and flings the blood outward, spreading the Prey's Bleed: every enemy within 8 meters gains the same number of Bleed stacks as the Prey. For 8 seconds, the user takes 20% less damage from Bleeding enemies."],["Beast","Respite",["Active","Defense"],"The Beast curls in on itself for 4 seconds, taking 50% less damage and restoring HP for each Bleeding enemy within 5 meters."]]},
{t:21,n:"Pent-Up Fury",g:["Form","Offense"],x:"",h:[["Human","Pent-Up Fury",["Passive","Offense"],"Every 5 seconds spent in human form during combat grants 1 Fury (max 30). On transforming into the Beast, each Fury grants +3% damage for the first 10 seconds."],["Beast","Feeding Frenzy",["Active","Damage"],"For 8 seconds, each of the Beast's hits consumes 1 Bleed on the target to deal bonus damage and restore HP. Each kill during the Frenzy extends it by 2 seconds."]]},
{t:33,n:"Moonbound",g:["Form"],c:1,x:"Using either half puts both on a 5-minute cooldown. Passive: transforming takes 2 seconds instead of 5, and Beast Form's cooldown is reduced to 2 minutes 30 seconds.",h:[["Human","Call of the Moon",["Active","Transformation"],"Instantly transforms into the Moonbeast, ignoring Beast Form's cooldown and channel. For 2 minutes, the Moonbeast has +50% to all stats instead of +20%, and every Beast skill's cooldown is reset when it appears. When the Moonbeast fades, the user remains in normal Beast Form."],["Beast","Last Light",["Active","Transformation"],"Instantly returns to human form, ignoring Beast Form's cooldown and channel. The user's next 3 active skills (not including capstones) from other trees are used at double effect."]]}]},
{id:"obsession",n:"Obsession",c:"cursed",r:"Rare",ty:"Cursed Tree",cu:["Compulsion","The first active skill used becomes the Obsession. Using any other active skill inflicts 1 Withdrawal and costs 10% of max HP. Going 9 seconds without using the Obsession also inflicts 1 Withdrawal per second until it is used again. Each Withdrawal reduces the user's damage, attack speed, and cast speed by 5% for 15 seconds (max 5 stacks). At 5 Withdrawal, the user Relapses: their next action is forced to be the Obsession, used on the nearest enemy, as soon as it is off cooldown.",[]],sk:[
{t:1,n:"Fixation",g:["Passive","Offense"],x:"Each consecutive use of the Obsession grants 1 Fixation (max 10). Each Fixation increases the Obsession's damage, healing, and barrier strength by 5%. Using any other active skill removes 3 Fixation."},
{t:3,n:"Relief",g:["Passive","Offense"],x:"Using the Obsession consumes all Withdrawal. That use deals +25% damage and restores a small amount of HP for each Withdrawal consumed."},
{t:6,n:"Fixate",g:["Active","Utility"],x:"Locks onto a target for 20 seconds. The Obsession deals +5% damage per Fixation to that target, but the user cannot perceive any other enemy more than 15 meters away. Fixate does not count as another active skill."},
{t:9,n:"Twitch",g:["Active","Mobility"],x:"A short dash. If the Obsession is used within 2 seconds afterward, that use grants 2 Fixation instead of 1. Twitch does not count as another active skill."},
{t:11,n:"Escalation",g:["Passive","Offense"],x:"The Obsession grows as Fixation rises.",s:[["3+ Fixation","its range and area are increased by 30%."],["6+ Fixation","it strikes one additional nearby target."],["10 Fixation","each use repeats once at 50% effect (the repeat grants no Fixation), and its hits count double toward hit-counting mechanics."]]},
{t:14,n:"Self-Soothe",g:["Active","Defense"],x:"The user clears all Withdrawal and takes 30% less damage for 5 seconds. This resets the Withdrawal timer, but grants no Fixation and does not trigger Relief. Self-Soothe does not count as another active skill."},
{t:21,n:"Breaking Point",g:["Active","Damage"],x:"Consumes all Fixation to use the Obsession once at +15% effect per Fixation consumed. Afterward, the user gains 5 Withdrawal and Relapses. Breaking Point does not count as another active skill."},
{t:33,n:"Consumation",g:["Active","Buff"],c:1,x:"For 20 seconds, the Obsession has no cooldown, each use grants 2 Fixation. When the effect ends, the user gains 5 Withdrawal and Relapses. Passive: Fixation max is increased to 20."}]}
