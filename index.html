<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Build Planner</title>
<style>
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#0f1115;color:#dfe3ea;padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:#151823;border-bottom:1px solid #232838;position:sticky;top:0;z-index:10}
h1{font-size:18px;margin:0}
button{background:#232838;color:#dfe3ea;border:1px solid #333a4f;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button:hover{background:#2c3346}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #5aa7ff;outline-offset:2px}
input,select,textarea{background:#0f1115;color:#dfe3ea;border:1px solid #333a4f;border-radius:6px;padding:7px 9px;font:inherit}
select:disabled{opacity:.6}
#wrap{display:grid;grid-template-columns:1fr 330px;gap:16px;padding:16px;max-width:1240px;margin:0 auto}
@media(max-width:960px){#wrap{grid-template-columns:1fr}}
#char{display:flex;gap:14px;background:#151823;border:1px solid #232838;border-radius:10px;padding:14px;margin-bottom:14px}
#portrait{width:96px;height:96px;border-radius:10px;border:2px dashed #333a4f;background-size:cover;background-position:center;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;color:#5a627a;font-size:12px;text-align:center}
.fields{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fields label{font-size:12px;color:#8b94ab;display:flex;gap:6px;align-items:center}
#slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:700px){#slots{grid-template-columns:1fr}}
.slot{border:2px dashed #333a4f;border-radius:10px;min-height:92px;padding:10px;cursor:pointer;background:#151823}
.slot.filled{border-style:solid}
.slot .plus{color:#5a627a;font-size:14px}
.slot .slotlab,.slotlab{font-size:11px;color:#8b94ab;text-transform:uppercase;letter-spacing:.08em}
.lock{float:right;padding:2px 7px;font-size:13px;line-height:1.3}
.lock.on{background:rgba(90,167,255,.2);border-color:#5aa7ff}
.tname{font-weight:700;font-size:15px}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;color:#0f1115;font-weight:700;display:inline-block}
.pbar{height:6px;background:#232838;border-radius:99px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px}
#pointsInfo{font-size:13px;margin:0 0 14px}
#ptsBar{position:sticky;top:var(--hh,56px);z-index:5;background:rgba(15,17,21,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);margin:0 -6px 12px;padding:8px 6px;border-bottom:1px solid #232838}
#ptsBar #pointsInfo{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:0}
#ptsBar #treeTools{margin:6px 0 0}
#pointsInfo .left{font-weight:700;color:#ffcf4d;font-size:15px}
#pointsInfo .left.over{color:#e5734f}
#pointsInfo .ptsdet{color:#8b94ab}
.ptsseg{display:flex;flex:1 1 140px;min-width:120px;height:6px;border-radius:3px;overflow:hidden;background:#232838;gap:1px}
.ptsseg i{display:block;min-width:0}
.ptsseg i.free{background:#2c3346}
.lock.mv{margin-right:4px}
.slot.moving{outline:2px solid #5aa7ff;outline-offset:2px}
.slot.target{border-color:#5aa7ff!important;border-style:dashed;background:rgba(90,167,255,.08)}
.slot.nodrop{opacity:.45;cursor:not-allowed}
.mvhint{font-size:12px;color:#8b94ab;margin-top:6px}
.mvhint.ok{color:#5aa7ff;font-weight:600}
.slot.filled[draggable=true]{cursor:grab}

#pointsInfo b{color:#ffcf4d}
.treebox{background:#151823;border:1px solid #232838;border-radius:10px;padding:14px;margin-bottom:14px}
.treehead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.treehead.tgl{cursor:pointer;border-radius:6px;margin:-4px -6px 10px;padding:4px 6px}
.treehead.tgl:hover{background:#1b2030}
.treehead.tgl:focus-visible{outline:2px solid #5aa7ff}
.chev{margin-left:auto;font-size:18px;line-height:1;color:#8b94ab;transition:transform .15s}
.chev.up{transform:rotate(180deg)}
.notches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.notch{min-width:40px;padding:6px 8px}
.notch.act{background:#3a4258;border-color:#5a627a}
.notch.no{opacity:.35;cursor:not-allowed}
.nhint{font-size:12px;color:#8b94ab;margin:4px 0 10px}
details.sk{border:1px solid #232838;border-radius:8px;margin:6px 0;background:#0f1115}
details.sk summary{padding:8px 10px;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
details.sk summary::-webkit-details-marker{display:none}
details.sk.off summary{opacity:.55}
details.sk.off .skimg{filter:grayscale(.85) brightness(.75)}
details.sk summary .skimg{width:34px;height:34px;border-radius:6px}
details.sk summary .chip{box-sizing:border-box;min-width:30px;text-align:center}
.treehead .tico{width:2.6em;height:2.6em;vertical-align:-.95em;border-radius:7px}
details.sk .body{display:flex;gap:10px;padding:2px 10px 10px;font-size:14px;line-height:1.45}
.skimg{display:block;width:48px;height:48px;border-radius:8px;flex:none;overflow:hidden;background:center/cover no-repeat}
.skimg img{display:block;width:100%;height:100%;object-fit:cover}
.tico{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;margin-right:.35em;vertical-align:-.38em;border-radius:5px;overflow:hidden;flex:none}
.tico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tglyph{font-size:.85em;line-height:1}
.slot .tico,.pcard .tico,#pkPrev .tico{width:1.9em;height:1.9em;vertical-align:-.55em;border-radius:6px}
#gtip .thead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
#gtip .thead .skimg{width:40px;height:40px;border-radius:6px}
#gtip .thead b{margin:0}
.tags{margin-left:auto;font-size:11px;color:#8b94ab}
.chip{font-size:11px;background:#232838;border-radius:6px;padding:2px 7px}
.star{color:#ffcf4d}
.ftab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.ftab td,.ftab th{border:1px solid #232838;padding:5px 8px;text-align:left;vertical-align:top}
#summary{position:sticky;top:calc(var(--hh,64px) + 12px);max-height:calc(100vh - var(--hh,64px) - 24px);overflow:auto;overscroll-behavior:contain;align-self:start;background:#151823;border:1px solid #232838;border-radius:10px;padding:14px;font-size:13px}
@media(max-width:960px){#summary{position:relative;top:auto;max-height:none;overflow:visible}}
#summary h3,.ccol h3{margin:0 0 8px;font-size:16px}
.ep{color:#8b94ab;font-style:italic}
.mtree{margin-top:10px;border-top:1px solid #232838;padding-top:8px}
.skl{display:inline-block;background:#232838;border-radius:6px;padding:2px 7px;margin:2px 2px;font-size:12px}
.skl.uniq{background:rgba(90,167,255,.18);box-shadow:inset 0 0 0 1px #5aa7ff}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.cgrid{grid-template-columns:1fr}}
.ccol{border:1px solid #232838;border-radius:8px;padding:12px;background:#0f1115;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(5,7,10,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.hidden{display:none}
.box{background:#151823;border:1px solid #333a4f;border-radius:12px;max-width:960px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.box h2{margin:0 0 12px;font-size:17px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border-radius:99px}
.tab.on{background:#5aa7ff;color:#0f1115;border-color:#5aa7ff;font-weight:700}
.pkgrid{display:grid;grid-template-columns:1fr 340px;gap:12px}
@media(max-width:800px){.pkgrid{grid-template-columns:1fr}}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start}
.pcard{border:1px solid #232838;border-radius:8px;padding:9px;cursor:pointer;background:#0f1115}
.pcard:hover{border-color:#5aa7ff}
.pcard.sel{border-color:#5aa7ff;outline:1px solid #5aa7ff}
.pcard.dis{opacity:.4;cursor:not-allowed}
.pcard .hint{font-size:11px;color:#8b94ab;margin-top:4px}
.pcards{grid-template-columns:repeat(3,1fr)}
@media(max-width:800px){.pcards{grid-template-columns:repeat(2,1fr)}}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pager button:disabled{opacity:.35;cursor:default}
.pnums{display:flex;gap:4px}
.pnum{min-width:32px;padding:4px 6px}
.pnum.on{background:#5aa7ff;color:#0f1115;border-color:#5aa7ff;font-weight:700}
#inpFlavor{flex:1 1 260px;min-height:0;margin:0;resize:vertical;line-height:1.35}
.cflav{margin:8px 0 0;font-size:12.5px;line-height:1.45;color:#aab1c2;white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid #333a4f;padding-left:8px}
.ccard.big .cflav{font-size:13.5px;margin-top:12px}

.preview{border:1px solid #232838;border-radius:8px;padding:10px;background:#0f1115}
.halves{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.half{border:1px solid #232838;border-radius:8px;padding:8px 10px;background:#151823}
.half .tags{margin-left:4px}
.hside{font-size:11px;color:#8b94ab;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.curse ul{margin:6px 0 0;padding-left:18px}
.gl{text-decoration:underline dotted #8b94ab;text-underline-offset:3px;cursor:help;border-radius:3px}
.gl:hover,.gl.on{text-decoration-color:#5aa7ff;background:rgba(90,167,255,.12)}
#gtip{position:fixed;z-index:100;max-width:min(320px,calc(100vw - 16px));background:#1b2030;border:1px solid #5aa7ff;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.45;color:#dfe3ea;box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .1s}
#gtip.show{opacity:1}
.cpop{position:absolute;top:10px;right:10px;padding:2px 8px;font-size:15px;line-height:1.3}
.chead{display:flex;gap:12px;align-items:center;padding-right:34px}
.cport{flex:none;width:64px;height:64px;border-radius:10px;background:#232838 center/cover no-repeat;border:1px solid #333a4f}
.cport.empty{display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#8b94ab}
.cid{min-width:0}
.cid h3{margin:0 0 2px!important;overflow-wrap:anywhere}
.cid .ep{margin-bottom:6px}
.cid .row{margin:0}
.cempty{color:#8b94ab;font-size:13px;margin:12px 0 0}
.ctree{margin-top:12px;border-top:1px solid #232838;padding-top:10px}
.cth{display:flex;align-items:center;gap:2px}
.ctn{flex:1;min-width:0;line-height:1.2}
.ccount{font-size:12px;color:#8b94ab}
.cbar{height:3px;background:#232838;border-radius:2px;margin:6px 0 8px;overflow:hidden}
.cbar i{display:block;height:100%}
.cicons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cskill{position:relative;display:block;cursor:help;border-radius:6px;outline:none}
.cskill .skimg{width:100%;height:auto;aspect-ratio:1;border-radius:6px;margin:0 auto}
.ccard.big .cskill .skimg,.cmpcard .cskill .skimg{width:min(100%,var(--isz))}
.cskill.locked .skimg{filter:grayscale(1) brightness(.45)}
.cskill.cap .skimg{box-shadow:0 0 0 1.5px #ffcf4d}
.cskill:hover .skimg,.cskill:focus-visible .skimg,.cskill.on .skimg{box-shadow:0 0 0 2px #5aa7ff}
.cardbox{position:relative;max-width:1000px;width:auto;padding:22px;max-height:calc(100vh - 24px)}
#card{padding:12px}
.cclose{position:absolute;top:12px;right:12px;padding:2px 9px;z-index:1}
/* pop-out card: identity column on the left, the three trees on the right, sized to fit one screen.
   --isz = icon size: the smaller of a width cap and what the viewport height leaves for 3 rows of icons. */
.ccard.big{--isz:min(96px,calc((100vh - 400px) / 3));display:grid;grid-template-columns:minmax(150px,210px) auto;column-gap:26px;align-items:start}
.ccard.big .chead{grid-column:1;grid-row:1 / span 4;flex-direction:column;align-items:stretch;gap:12px;padding:0}
.ccard.big .cport{width:100%;height:auto;aspect-ratio:1;border-radius:14px}
.ccard.big .cport.empty{font-size:64px}
.ccard.big .cid h3{font-size:24px}
.ccard.big .cid .ep{font-size:15px;margin-bottom:10px}
.ccard.big .ctree{grid-column:2;margin-top:10px;padding-top:10px}
.ccard.big .ctree:nth-child(2){margin-top:0;padding-top:0;border-top:0}
.ccard.big .cth{padding-right:36px}
.ccard.big .ctree:not(:nth-child(2)) .cth{padding-right:0}
.ccard.big .cth .tico{width:2.1em;height:2.1em}
.ccard.big .ctn b{font-size:16px}
.clab{display:block;font-size:10.5px;color:#8b94ab;text-transform:uppercase;letter-spacing:.08em}
.ccard.big .ccount{font-size:13px}
.ccard.big .cbar{margin:5px 0 7px}
.ccard.big .cicons{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.ccard.big .cskill .skimg{border-radius:8px}
.cname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:11px;line-height:1.25;height:2.5em;text-align:center;color:#c4cad6;overflow-wrap:anywhere}
.cskill.locked .cname{color:#5d6478}
/* narrow screens: portrait beside the name on top, 8 small icons per row, names via tap */
@media(max-width:760px){
  .ccard.big{display:block}
  .ccard.big .chead{flex-direction:row;align-items:center;gap:14px;padding-right:40px}
  .ccard.big .cport{width:84px;flex:none}
  .ccard.big .cid h3{font-size:20px}
  .ccard.big .ctree,.ccard.big .ctree:nth-child(2){margin-top:12px;padding-top:10px;border-top:1px solid #232838}
  .ccard.big .cth{padding-right:0}
  .ccard.big .cicons{grid-template-columns:repeat(8,1fr);gap:4px}
  .ccard.big .cname{display:none}
}

/* picker: on desktop the window never scrolls; the preview column scrolls by itself */
@media(min-width:801px){
  .pkbox{display:flex;flex-direction:column;height:calc(100vh - 40px);max-height:860px;overflow:hidden}
  .pkbox>h2,.pkbox>.tabs,.pkbox>#pkSearch,.pkbox>.row{flex:none}
  .pkbox .pkgrid{flex:1;min-height:0;margin-top:10px}
  .pkbox .pkgrid>div:first-child{overflow:auto;min-height:0;padding:1px}
  .pkbox .preview{overflow:auto;min-height:0}
  .pkbox .preview>.row:last-child{position:sticky;bottom:-10px;margin:6px -10px -10px;padding:8px 10px 10px;background:#0f1115;border-top:1px solid #232838}
  .pkbox>.row{margin-top:10px}
}
.pcard{padding:6px 9px;line-height:1.3}
.pcard .tico{width:1.75em;height:1.75em}
.pkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pkhead h2{margin:0}
.pkbtns{display:flex;gap:6px}
@media(min-width:801px){.pkbox>.pkhead{flex:none}}
.pcards{gap:6px}
/* bold skill names on cards */
.cname{font-weight:650;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.cmpcard .cname{overflow-wrap:break-word}
/* compare: two card columns sized to fit the screen */
.cmpbox{position:relative;max-width:1400px;max-height:calc(100vh - 24px)}
#cmp{padding:12px}
.cmpbox h2{padding-right:40px}
.cmpbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0}
.cmpbar .nhint{margin:0}
.ukey{display:inline-block;width:10px;height:10px;border-radius:3px;box-shadow:0 0 0 2px #5aa7ff;vertical-align:-1px;margin-right:4px}
.cmpcard{--isz:max(34px,min(64px,calc((100vh - 610px) / 3)))}
.cmpcard .ccol{padding:12px 14px}
.cmpcard .chead{padding-right:0}
.cmpcard .cport{width:56px;height:56px}
.cmpcard .cid h3{font-size:17px}
.cmpcard .ctree{margin-top:10px;padding-top:8px}
.cmpcard .cicons{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.cmpcard .cname{font-size:10.5px;line-height:1.25;height:2.5em}
.cmpcard .cth .tico{width:1.9em;height:1.9em}
.cmpcard .cskill.uniq .skimg{box-shadow:0 0 0 2px #5aa7ff}
.cmpcard .cskill.uniq .cname{color:#8fc3ff}
.cshared{color:#5aa7ff}
.cempty2{display:block;color:#5a627a;font-size:12px;margin-top:4px}
@media(max-height:720px){.cmpcard{--isz:max(34px,min(64px,calc((100vh - 545px) / 3)))}.cmpcard .cname{display:none}}
@media(max-width:700px){.cmpcard .cicons{grid-template-columns:repeat(8,1fr);gap:3px}.cmpcard .cname{display:none}}

/* ---- picker polish ---- */
.xbtn{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:16px;border-radius:8px;transition:background .15s,border-color .15s,color .15s}
.xbtn:hover{background:#e5484d;border-color:#e5484d;color:#fff}
.pkact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-keep{background:#5aa7ff;color:#0f1115;border-color:#5aa7ff;font-weight:700}
.btn-keep:hover{background:#7cbaff}
.btn-clear{margin-left:auto;background:rgba(229,72,77,.1);color:#ff8a8d;border-color:rgba(229,72,77,.55);font-weight:600}
.btn-clear:hover{background:#e5484d;border-color:#e5484d;color:#fff}
@media(min-width:801px){
  .pkbox .pkleft{display:flex;flex-direction:column;overflow:hidden!important}
  .pkbox .pkleft .pcards{flex:1;min-height:0;overflow:auto;padding:1px}
  .pkbox .pkleft .pager{flex:none;margin-top:8px;padding-top:8px;border-top:1px solid #232838}
}
/* ---- category colours: every class family has its own hover ---- */
[data-cat="all"]{--cc:#5aa7ff}
[data-cat="melee"]{--cc:#ff7a45}
[data-cat="ranged"]{--cc:#5fd08a}
[data-cat="magic"]{--cc:#a77bff}
[data-cat="support"]{--cc:#f2c94c}
[data-cat="auxiliary"]{--cc:#35c9d6}
[data-cat="cursed"]{--cc:#e0245e}
.tab[data-cat]{position:relative;overflow:hidden;transition:border-color .2s,color .2s,box-shadow .2s,transform .15s,background .2s}
.tglyph2{margin-right:5px;opacity:.75;display:inline-block;transition:transform .25s}
.tab[data-cat]:hover{border-color:var(--cc);color:var(--cc);box-shadow:0 0 12px -2px var(--cc);transform:translateY(-1px);background:#1b2030}
.tab[data-cat].on{background:var(--cc);border-color:var(--cc);color:#0f1115}
.tab[data-cat].on:hover{color:#0f1115;background:var(--cc)}
.tab[data-cat].on .tglyph2{opacity:1}
/* melee: a blade-flash sweeps across */
.tab[data-cat="melee"]::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.tab[data-cat="melee"]:hover::after{animation:slash .5s ease-out}
.tab[data-cat="melee"]:hover .tglyph2{transform:rotate(-20deg) scale(1.15)}
@keyframes slash{to{transform:translateX(120%)}}
/* ranged: the glyph fires forward */
.tab[data-cat="ranged"]:hover .tglyph2{animation:shoot .45s ease-out}
@keyframes shoot{0%{transform:translateX(0)}50%{transform:translateX(4px)}100%{transform:translateX(0)}}
/* magic: shimmering arcane gradient */
.tab[data-cat="magic"]:hover{background:linear-gradient(90deg,#1b2030,#2a1f45,#1b2030);background-size:200% 100%;animation:arcane 1.6s linear infinite}
.tab[data-cat="magic"]:hover .tglyph2{animation:spin 1.6s linear infinite}
@keyframes arcane{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* support: a soft holy pulse */
.tab[data-cat="support"]:hover{animation:holy 1.4s ease-in-out infinite}
@keyframes holy{0%,100%{box-shadow:0 0 6px -2px var(--cc)}50%{box-shadow:0 0 16px 1px var(--cc)}}
/* auxiliary: the glyph ticks around like a gear */
.tab[data-cat="auxiliary"]:hover .tglyph2{animation:tick 1s steps(4) infinite}
@keyframes tick{to{transform:rotate(90deg)}}
/* cursed: flickering, unstable glow */
.tab[data-cat="cursed"]:hover{animation:flicker 1.1s infinite;text-shadow:0 0 6px var(--cc)}
@keyframes flicker{0%,100%{box-shadow:0 0 14px -2px var(--cc);opacity:1}42%{opacity:1}44%{opacity:.6;box-shadow:none}46%{opacity:1}70%{box-shadow:0 0 18px 0 var(--cc)}}
/* tree cards light up in their family colour */
.pcard{transition:border-color .2s,box-shadow .2s,transform .15s}
.pcard[data-cat]:not(.dis):hover{border-color:var(--cc);box-shadow:0 0 14px -4px var(--cc);transform:translateY(-1px)}
.pcard[data-cat].sel{border-color:var(--cc);outline-color:var(--cc);box-shadow:0 0 12px -4px var(--cc)}
@media(prefers-reduced-motion:reduce){.tab[data-cat],.tab[data-cat]::after,.tglyph2,.pcard{animation:none!important;transition:none!important;transform:none!important}}
#gtip .tlock{font-size:11px;color:#e5a54f;margin-top:2px}

#gtip.wide{max-width:min(380px,calc(100vw - 16px));max-height:60vh;overflow:auto}
#gtip.pinned{pointer-events:auto}
#gtip ul{margin:6px 0 0;padding-left:18px}
#gtip .tmeta{font-size:11px;color:#8b94ab;margin-bottom:4px}
#gtip span.tmeta{margin:0}
#gtip .thalf{margin-top:6px;padding-top:6px;border-top:1px solid #2c3346}
.skl[data-s]{cursor:help}
.skl[data-s]:hover,.skl[data-s].on{background:#2c3346;box-shadow:inset 0 0 0 1px #5aa7ff}
.slist{margin-top:4px}
.sitem{padding:6px 0;border-top:1px solid #232838;font-size:12.5px;line-height:1.45;color:#c4cad6}
.sitem:first-child{border-top:0}
.sitem b{color:#dfe3ea}
.sitem .tags{font-size:11px;color:#8b94ab}

#gtip b{display:block;color:#5aa7ff;margin-bottom:2px}
#treeTools{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:-4px 0 12px;font-size:13px}
#treeTools:empty{display:none}
.lnk{background:none;border:0;padding:2px 0;color:#5aa7ff;font:inherit;font-size:13px;cursor:pointer}
.lnk:hover{text-decoration:underline}

.sktools{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px;color:#8b94ab;margin-bottom:8px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#232838;border:1px solid #5aa7ff;padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}

<body>

<header>
  <h1>Build Planner</h1>
  <div>
    <button onclick="randomBuild()" title="Locked slots are kept">🎲 Random</button>
    <button onclick="openSave()">Save</button>
    <button onclick="openLoad()">Load</button>
    <button onclick="openCompare()">⇄ Compare</button>
    <button onclick="openShare()">🌐 Share</button>
    <button onclick="resetAll()">Reset</button>
  </div>
</header>

<div id="wrap">
  <div>
    <div id="char">
      <div id="portrait" onclick="$('#file').click()">click to<br>upload</div>
      <input type="file" id="file" accept="image/*" hidden onchange="uploadImg(this)">
      <div class="fields">
        <input id="inpName" placeholder="Name" maxlength="60" style="flex:1;min-width:140px" oninput="S.name=this.value;softRender()">
        <input id="inpEpithet" placeholder="Title" maxlength="80" style="flex:1;min-width:140px" oninput="S.epithet=this.value;softRender()">
        <label>Rank
          <select id="selRank" onchange="S.rank=this.value;RANK_PINNED=true;renderAll()">
            <option value="U">Unranked</option><option>E</option><option>D</option><option>C</option><option>B</option><option>A</option>
          </select>
        </label>
        <input id="inpImg" placeholder="Img link here" style="flex:1;min-width:200px" onchange="setImgUrl(this.value)">
        <label>Level <input id="inpLevel" type="number" min="1" max="100" value="1" style="width:70px" onchange="setLevel(this.value)"></label>
        <textarea id="inpFlavor" rows="2" maxlength="300" placeholder="Flavor text (optional)" oninput="S.flavor=this.value;softRender()"></textarea>
      </div>
    </div>

    <div id="slots"></div>
    <div id="ptsBar"><p id="pointsInfo"></p><div id="treeTools"></div></div>
    <div id="trees"></div>
  </div>

  <aside id="summary"></aside>
</div>

<!-- tree picker -->
<div id="picker" class="modal hidden" onclick="if(event.target===this)closePicker()">
  <div class="box pkbox">
    <div class="pkhead"><h2 id="pkTitle">Choose a tree</h2><button class="xbtn" onclick="closePicker()" aria-label="Close" title="Close">✕</button></div>
    <div class="tabs" id="pkTabs"></div>
    <input id="pkSearch" placeholder="Search trees, skills or effects (e.g. Burn, Tempo, Debt)" style="width:100%" oninput="pk.q=this.value;pk.page=0;renderCards()">
    <div class="pkgrid">
      <div class="pkleft"><div class="pcards" id="pkCards"></div><div class="pager" id="pkPager"></div></div>
      <div class="preview" id="pkPrev"><span style="color:#5a627a">Click a tree to preview it.</span></div>
    </div>
  </div>
</div>

<!-- share -->
<div id="share" class="modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="box" style="max-width:640px">
    <h2>Share this build</h2>
    <p id="shFrame" class="nhint" style="display:none">This preview runs inside a frame, so links copied here won't open the build. They work once the page is hosted on its own, like on GitHub Pages.</p>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 8px"><input type="checkbox" id="shImg" onchange="makeLink()"> Include portrait</label>
    <div class="row"><input id="shUrl" readonly style="flex:1"><button class="primary" onclick="copyLink()">Copy link</button></div>
    <details style="margin-top:12px">
      <summary style="cursor:pointer"><b>Build code / import</b></summary>
      <div class="row"><input id="shCode" readonly style="flex:1"><button onclick="copyCode()">Copy code</button></div>
      <textarea id="shIn" placeholder="Paste a build code or link here"></textarea>
      <div class="row"><button onclick="doImport()">Load build</button></div>
    </details>
  </div>
</div>

<!-- character card pop-out -->
<div id="card" class="modal hidden" onclick="if(event.target===this)closeCard()">
  <div class="box cardbox">
    <button class="cclose" onclick="closeCard()" aria-label="Close">✕</button>
    <div id="cardBody" class="ccard big"></div>
  </div>
</div>

<!-- saved builds -->
<div id="saves" class="modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="box" style="max-width:560px">
    <h2 id="svTitle">Saved builds</h2>
    <div id="svList"></div>
    <div class="row" id="svRow"><input id="svName" placeholder="Build name" maxlength="60" style="flex:1"><button onclick="doSave()">Save</button></div>
    <div class="row"><button onclick="$('#saves').classList.add('hidden')">Close</button></div>
  </div>
</div>

<!-- compare -->
<div id="cmp" class="modal hidden" onclick="if(event.target===this){glHide();this.classList.add('hidden')}">
  <div class="box cmpbox">
    <button class="cclose" onclick="glHide();$('#cmp').classList.add('hidden')" aria-label="Close">✕</button>
    <h2>Compare builds</h2>
    <div class="row"><select id="cmpSel" onchange="cmpFromSave(this.value)" style="flex:1"></select></div>
    <div class="row"><input id="cmpIn" placeholder="…or paste a build code or share link" style="flex:1"><button onclick="cmpFromCode()">Compare</button></div>
    <div id="cmpOut"></div>
  </div>
</div>

<div id="toast"></div>
<div id="gtip" role="tooltip"></div>
